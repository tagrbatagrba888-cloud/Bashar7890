<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="theme-color" content="#0a1929" />
<meta name="description" content="لوحة التحكم - BORSA CLUP" />
<title>BORSA CLUP - الرئيسية</title>

<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BORSA CLUP" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" id="siteFavicon" href="https://i.ibb.co/PzcMFkpR/FB-IMG-1789241464654.jpg" />
<link rel="apple-touch-icon" id="siteAppleIcon" href="https://i.ibb.co/PzcMFkpR/FB-IMG-1789241464654.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />

<script src="auth-guard.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { min-height:100%; font-family:'Cairo', sans-serif; background:#000; overflow-x:hidden; }
  body {
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    background:radial-gradient(circle at 50% 0%, #0f2f4a 0%, #0a1929 40%, #000 100%);
  }

  .loading-screen {
    position:fixed; inset:0; z-index:9999;
    background:radial-gradient(circle at 50% 30%, #0f2f4a 0%, #0a1929 40%, #000 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    transition:opacity .6s ease, visibility .6s ease;
    overflow:hidden;
  }
  .loading-screen.hide { opacity:0; visibility:hidden; pointer-events:none; }
  .loading-screen::before {
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(30,144,255,.6), transparent),
      radial-gradient(2px 2px at 60% 70%, rgba(30,144,255,.4), transparent),
      radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,.3), transparent);
    animation:starsMove 20s linear infinite;
  }
  @keyframes starsMove { to { transform:translateY(-100vh); } }
  .loading-content {
    position:relative; z-index:2;
    display:flex; flex-direction:column;
    align-items:center; gap:22px;
    animation:fadeInScale .8s ease;
  }
  @keyframes fadeInScale {
    from { opacity:0; transform:scale(.9); } to { opacity:1; transform:scale(1); }
  }
  .logo-loader {
    position:relative; width:160px; height:160px;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-loader::before {
    content:''; position:absolute; inset:0;
    border-radius:50%; border:3px solid transparent;
    border-top-color:#1e90ff; border-right-color:#1e90ff;
    animation:spinRing 1.5s linear infinite;
    box-shadow:0 0 20px rgba(30,144,255,.5);
  }
  @keyframes spinRing { to { transform:rotate(360deg); } }
  .loading-logo {
    width:110px; height:110px; border-radius:50%; object-fit:cover;
    border:3px solid rgba(30,144,255,.4);
    box-shadow:0 0 30px rgba(30,144,255,.6);
    animation:pulseLogo 2s ease-in-out infinite;
  }
  @keyframes pulseLogo { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  .loading-brand {
    font-size:28px; font-weight:900; letter-spacing:2px; color:#fff;
    text-shadow:0 0 20px rgba(30,144,255,.8);
  }
  .loading-brand span { color:#1e90ff; }
  .loading-sub { color:#8fb3d9; font-size:13px; font-weight:600; }
  .loading-bar {
    width:220px; height:4px; background:rgba(255,255,255,.08);
    border-radius:2px; overflow:hidden;
  }
  .loading-bar-fill {
    height:100%;
    background:linear-gradient(90deg, #0066cc, #1e90ff, #6bb7ff);
    background-size:200% 100%; width:0%; transition:width .4s ease;
    animation:barShine 2s linear infinite; border-radius:2px;
    box-shadow:0 0 12px rgba(30,144,255,.8);
  }
  @keyframes barShine { 0%{background-position:0% 0%;} 100%{background-position:200% 0%;} }
  .loading-footer {
    position:absolute; bottom:30px; color:#4d6d8f;
    font-size:11px; letter-spacing:1px; font-weight:600; z-index:2;
  }

  .phone {
    width:100%; max-width:430px; min-height:100vh;
    background:linear-gradient(180deg,#0a1929 0%,#06121e 100%);
    display:flex; flex-direction:column;
    box-shadow:0 0 60px rgba(30,144,255,.25);
    position:relative; overflow:hidden;
    opacity:0; transition:opacity .6s ease;
  }
  .phone.show { opacity:1; }

  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    background:rgba(255,255,255,.03);
    border-bottom:1px solid rgba(30,144,255,.25);
    position:sticky; top:0; z-index:20;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    gap:8px;
  }
  .topbar .title { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .topbar img {
    width:40px; height:40px; border-radius:50%;
    border:2px solid #1e90ff; object-fit:cover;
    box-shadow:0 0 12px rgba(30,144,255,.5);
  }
  .topbar .name { font-size:15px; font-weight:900; color:#fff; }
  .topbar .name span { color:#1e90ff; }
  .topbar-actions { display:flex; gap:6px; align-items:center; }
  .icon-btn {
    width:38px; height:38px; border-radius:10px;
    border:none; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transition:.25s; text-decoration:none;
  }
  .icon-btn.settings {
    background:linear-gradient(135deg,#1e90ff,#0066cc);
    color:#fff; box-shadow:0 6px 14px rgba(30,144,255,.35);
  }
  .icon-btn.settings:hover { transform:translateY(-2px); }
  .icon-btn.logout {
    background:linear-gradient(135deg,#ff3b3b,#b00000);
    color:#fff; box-shadow:0 6px 14px rgba(255,60,60,.35);
  }
  .icon-btn.logout:hover { transform:translateY(-2px); }
  .icon-btn.burger {
    background:rgba(255,255,255,.06);
    color:#a8c8e8; border:1px solid rgba(255,255,255,.1);
  }
  .icon-btn.burger:hover { background:rgba(255,255,255,.12); color:#fff; }
  .icon-btn.burger.open {
    background:linear-gradient(135deg,#1e90ff,#0066cc);
    color:#fff; border-color:#1e90ff;
  }

  .content { flex:1; padding:18px 16px 40px; overflow-y:auto; }

  .welcome-card {
    padding:20px;
    background:linear-gradient(135deg, rgba(30,144,255,.15), rgba(0,60,120,.2));
    border:1px solid rgba(30,144,255,.3);
    border-radius:18px; margin-bottom:18px;
    animation:fadeUp .6s ease;
    position:relative; overflow:hidden;
  }
  .welcome-card::before {
    content:''; position:absolute;
    top:-40px; left:-40px; width:120px; height:120px;
    background:radial-gradient(circle, rgba(30,144,255,.3) 0%, transparent 70%);
    border-radius:50%;
  }
  .welcome-card h1 {
    font-size:19px; color:#fff; font-weight:900;
    margin-bottom:6px; position:relative; z-index:1;
  }
  .welcome-card h1 span { color:#1e90ff; }
  .welcome-card p {
    color:#a8c8e8; font-size:12.5px;
    line-height:1.6; font-weight:600;
    position:relative; z-index:1;
  }

  .section-title {
    color:#fff; font-size:14.5px; font-weight:700;
    margin:18px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title::before {
    content:''; width:4px; height:18px;
    background:#1e90ff; border-radius:2px;
  }

  .stats-grid {
    display:grid; grid-template-columns:repeat(2,1fr);
    gap:12px; animation:fadeUp .7s ease;
  }
  .stat-card {
    padding:18px 16px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(30,144,255,.22);
    border-radius:16px; text-align:center;
    transition:.25s; position:relative; overflow:hidden;
    cursor:pointer; text-decoration:none;
  }
  .stat-card::before {
    content:''; position:absolute;
    top:0; right:0; left:0; height:3px;
    background:linear-gradient(90deg,#1e90ff,#0066cc);
    opacity:.6;
  }
  .stat-card:hover {
    transform:translateY(-3px); border-color:#1e90ff;
    box-shadow:0 10px 26px rgba(30,144,255,.25);
  }
  .stat-card .ico { font-size:28px; margin-bottom:8px; }
  .stat-card .num {
    font-size:30px; font-weight:900;
    color:#fff; margin-bottom:4px;
    font-variant-numeric:tabular-nums;
    transition:.3s;
  }
  .stat-card .num.loading { opacity:.4; animation:pulse 1.2s infinite; }
  .stat-card .lbl {
    font-size:12px; color:#8fb3d9; font-weight:700;
  }
  .stat-card.stocks::before   { background:linear-gradient(90deg,#1e90ff,#0066cc); }
  .stat-card.recommend::before{ background:linear-gradient(90deg,#ffc800,#ff9800); }

  .actions-grid {
    display:grid; grid-template-columns:repeat(2,1fr);
    gap:12px; animation:fadeUp .8s ease;
  }
  .action-btn {
    padding:20px 12px;
    background:linear-gradient(135deg, rgba(30,144,255,.14), rgba(0,60,120,.2));
    border:1px solid rgba(30,144,255,.32);
    border-radius:18px; text-align:center;
    cursor:pointer; transition:.25s;
    color:inherit; text-decoration:none;
    display:block; position:relative; overflow:hidden;
  }
  .action-btn:hover {
    transform:translateY(-3px); border-color:#1e90ff;
    box-shadow:0 12px 28px rgba(30,144,255,.28);
    background:linear-gradient(135deg, rgba(30,144,255,.22), rgba(0,60,120,.3));
  }
  .action-btn:active { transform:scale(.98); }
  .action-btn .ico { font-size:30px; margin-bottom:8px; display:block; }
  .action-btn .lbl { color:#fff; font-size:13.5px; font-weight:800; }

  .empty-state {
    text-align:center; padding:30px 20px;
    color:#4d6d8f; font-size:13px; font-weight:600;
    grid-column:1 / -1;
  }

  .footer {
    text-align:center; padding:16px;
    font-size:11px; color:#4d6d8f;
  }

  /* Burger Menu */
  .burger-menu {
    position:fixed; inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:none; z-index:100;
    animation:fadeIn .25s ease;
  }
  .burger-menu.open { display:block; }
  .burger-panel {
    position:absolute; top:0; right:0;
    width:82%; max-width:340px; height:100%;
    background:linear-gradient(180deg,#0d1f33,#0a1929);
    border-left:1px solid rgba(30,144,255,.35);
    box-shadow:-20px 0 60px rgba(0,0,0,.7);
    display:flex; flex-direction:column;
    animation:slideIn .3s ease; overflow-y:auto;
  }
  @keyframes slideIn {
    from { transform:translateX(100%); }
    to   { transform:translateX(0); }
  }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

  .burger-header {
    padding:18px 18px 12px;
    border-bottom:1px solid rgba(30,144,255,.2);
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .burger-header .title { display:flex; align-items:center; gap:10px; }
  .burger-header img {
    width:40px; height:40px; border-radius:50%;
    border:2px solid #1e90ff; object-fit:cover;
  }
  .burger-header .name { font-size:14px; font-weight:900; color:#fff; }
  .burger-header .name span { color:#1e90ff; }
  .burger-close {
    width:34px; height:34px; border-radius:9px;
    background:rgba(255,60,60,.15); color:#ff6b6b;
    border:1px solid rgba(255,60,60,.3);
    cursor:pointer; font-size:18px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    transition:.2s;
  }
  .burger-close:hover { background:#ff3b3b; color:#fff; }

  .burger-user {
    padding:14px 18px;
    border-bottom:1px solid rgba(255,255,255,.06);
    display:flex; align-items:center; gap:10px;
  }
  .burger-user .avatar {
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg,#1e90ff,#0066cc);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:900; font-size:16px;
    flex-shrink:0; border:2px solid rgba(30,144,255,.5);
  }
  .burger-user .info { flex:1; min-width:0; }
  .burger-user .uname {
    color:#fff; font-size:13.5px; font-weight:900;
    margin-bottom:2px; word-break:break-all;
  }
  .burger-user .urole { color:#8fb3d9; font-size:11px; font-weight:600; }

  .burger-nav {
    padding:10px 12px;
    display:flex; flex-direction:column; gap:6px;
    flex:1;
  }
  .burger-nav-item {
    display:flex; align-items:center; gap:12px;
    padding:12px 14px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(30,144,255,.18);
    border-radius:12px; text-decoration:none;
    color:inherit; transition:.2s; cursor:pointer;
  }
  .burger-nav-item:hover {
    background:rgba(30,144,255,.12);
    border-color:#1e90ff; transform:translateX(-3px);
  }
  .burger-nav-item .bn-icon {
    width:40px; height:40px; border-radius:10px;
    background:linear-gradient(135deg,#1e90ff,#0066cc);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; flex-shrink:0;
    box-shadow:0 4px 12px rgba(30,144,255,.3);
  }
  .burger-nav-item .bn-lbl {
    color:#fff; font-size:13.5px; font-weight:800; flex:1;
  }
  .burger-nav-item .bn-arrow { color:#6b8fb0; font-size:16px; }

  .burger-footer {
    padding:14px 18px;
    border-top:1px solid rgba(255,255,255,.06);
    display:flex; flex-direction:column; gap:8px;
  }
  .burger-action {
    padding:12px; border-radius:11px;
    border:none; cursor:pointer;
    font-family:'Cairo',sans-serif;
    font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:.2s; text-decoration:none;
  }
  .burger-action.settings {
    background:linear-gradient(135deg,#1e90ff,#0066cc);
    color:#fff; box-shadow:0 6px 16px rgba(30,144,255,.35);
  }
  .burger-action.settings:hover { transform:translateY(-2px); }
  .burger-action.logout {
    background:linear-gradient(135deg,#ff3b3b,#b00000);
    color:#fff; box-shadow:0 6px 16px rgba(255,60,60,.35);
  }
  .burger-action.logout:hover { transform:translateY(-2px); }

  @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:none;} }
  @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }

  @media (min-width:768px) {
    body { padding:30px; }
    .phone {
      max-width:720px; min-height:auto; height:auto;
      border-radius:28px;
      border:1px solid rgba(30,144,255,.25);
      box-shadow:0 25px 70px rgba(0,150,255,.3);
    }
    .content { padding:24px 28px 40px; }
    .welcome-card { padding:26px; }
    .welcome-card h1 { font-size:24px; }
    .stats-grid { grid-template-columns:repeat(2,1fr); gap:16px; }
    .stat-card { padding:26px 22px; }
    .stat-card .num { font-size:38px; }
    .actions-grid { grid-template-columns:repeat(4,1fr); gap:14px; }
    .action-btn { padding:24px 16px; }
    .action-btn .ico { font-size:36px; }
    .section-title { font-size:16px; }
  }

  @media (min-width:1024px) {
    body { padding:40px 30px; }
    .phone { max-width:1200px; height:auto; min-height:auto; border-radius:26px; }
    .content { padding:32px 40px 40px; }
    .welcome-card { padding:30px; }
    .welcome-card h1 { font-size:28px; }
    .stats-grid { grid-template-columns:repeat(2,1fr); gap:20px; }
    .stat-card { padding:32px 24px; }
    .stat-card .num { font-size:44px; }
    .actions-grid { grid-template-columns:repeat(4,1fr); gap:18px; }
    .action-btn { padding:28px 20px; }
    .action-btn .ico { font-size:42px; }
  }
  @media (min-width:1440px) {
    .phone { max-width:1400px; }
    .actions-grid { grid-template-columns:repeat(5,1fr); }
  }

  /* ============ Modal السبب (تعطيل/حظر/حذف) ============ */
  .reason-modal {
    position:fixed; inset:0;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:99999;
    animation:fadeIn .3s ease;
  }
  .reason-modal.show { display:flex; }
  .reason-box {
    width:100%; max-width:420px;
    background:linear-gradient(180deg,#0d1f33,#0a1929);
    border:1px solid rgba(255,60,60,.4);
    border-radius:22px; padding:28px 22px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.8);
    animation:popIn .4s ease;
  }
  @keyframes popIn { from{opacity:0;transform:scale(.9);} to{opacity:1;transform:scale(1);} }
  .reason-icon {
    width:80px; height:80px; border-radius:50%;
    margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    font-size:42px;
  }
  .reason-icon.disabled { background:rgba(255,180,0,.15); border:2px solid rgba(255,180,0,.4); }
  .reason-icon.banned { background:rgba(255,60,60,.15); border:2px solid rgba(255,60,60,.4); }
  .reason-icon.deleted { background:rgba(255,60,60,.15); border:2px solid rgba(255,60,60,.4); }
  .reason-title {
    color:#fff; font-size:20px; font-weight:900;
    margin-bottom:10px;
  }
  .reason-text {
    color:#c8d8e8; font-size:14px;
    line-height:1.8; margin-bottom:20px;
    font-weight:600;
  }
  .reason-btn {
    width:100%; padding:13px;
    background:linear-gradient(135deg,#ff3b3b,#b00000);
    color:#fff; border:none; border-radius:12px;
    font-family:'Cairo',sans-serif;
    font-size:15px; font-weight:800;
    cursor:pointer; transition:.25s;
    box-shadow:0 8px 22px rgba(255,60,60,.35);
  }
  .reason-btn:hover { transform:translateY(-2px); }
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-content">
    <div class="logo-loader">
      <img id="loadingLogo" class="loading-logo" src="https://i.ibb.co/PzcMFkpR/FB-IMG-1789241464654.jpg" alt="BORSA CLUP" />
    </div>
    <div class="loading-brand" id="loadingBrand">BORSA <span>CLUP</span></div>
    <div class="loading-sub">البورصة المصرية</div>
    <div class="loading-bar">
      <div class="loading-bar-fill" id="loadingBarFill"></div>
    </div>
  </div>
  <div class="loading-footer">© BORSA CLUP</div>
</div>

<!-- ★★★ Modal السبب ★★★ -->
<div class="reason-modal" id="reasonModal">
  <div class="reason-box">
    <div class="reason-icon" id="reasonIcon">⚠️</div>
    <div class="reason-title" id="reasonTitle">تم تسجيل خروجك</div>
    <div class="reason-text" id="reasonText">—</div>
    <button class="reason-btn" id="reasonBtn">العودة لتسجيل الدخول</button>
  </div>
</div>

<div class="phone" id="phoneApp" style="display:none;">

  <div class="topbar">
    <div class="title">
      <img id="topLogo" src="https://i.ibb.co/PzcMFkpR/FB-IMG-1789241464654.jpg" alt="BORSA CLUP" />
      <div class="name" id="topName">BORSA <span>CLUP</span></div>
    </div>
    <div class="topbar-actions">
      <a href="settings.html" class="icon-btn settings" id="settingsBtn" title="الإعدادات" style="display:none;">⚙️</a>
      <button class="icon-btn logout" id="logoutBtn" title="خروج">🚪</button>
      <button class="icon-btn burger" id="burgerBtn" title="القائمة" style="display:none;">☰</button>
    </div>
  </div>

  <div class="content">

    <div class="welcome-card">
      <h1>أهلاً بك، <span id="adminName">—</span> 👋</h1>
      <p id="welcomeSub">هذه لوحة التحكم الخاصة بمنصة البورصة المصرية.</p>
    </div>

    <div class="section-title">📊 الإحصائيات</div>
    <div class="stats-grid">
      <a href="ashom.html" class="stat-card stocks">
        <div class="ico">📈</div>
        <div class="num loading" id="statStocks">—</div>
        <div class="lbl">الأسهم</div>
      </a>
      <a href="tawseat.html" class="stat-card recommend">
        <div class="ico">💡</div>
        <div class="num loading" id="statRecommend">—</div>
        <div class="lbl">التوصيات</div>
      </a>
    </div>

    <div class="section-title">🎯 الأقسام</div>
    <div class="actions-grid" id="actionsGrid">
      <div class="empty-state">جارٍ التحميل...</div>
    </div>

  </div>

  <div class="footer">© BORSA CLUP — جميع الحقوق محفوظة</div>
</div>

<!-- Burger -->
<div class="burger-menu" id="burgerMenu">
  <div class="burger-panel" onclick="event.stopPropagation()">
    <div class="burger-header">
      <div class="title">
        <img id="burgerLogo" src="https://i.ibb.co/PzcMFkpR/FB-IMG-1789241464654.jpg" alt="BORSA CLUP" />
        <div class="name" id="burgerName">BORSA <span>CLUP</span></div>
      </div>
      <button class="burger-close" id="burgerClose">×</button>
    </div>

    <div class="burger-user">
      <div class="avatar" id="burgerAvatar">B</div>
      <div class="info">
        <div class="uname" id="burgerUsername">—</div>
        <div class="urole" id="burgerRole">مشرف</div>
      </div>
    </div>

    <nav class="burger-nav" id="burgerNav"></nav>

    <div class="burger-footer">
      <a href="settings.html" class="burger-action settings" id="burgerSettingsBtn" style="display:none;">
        ⚙️ الإعدادات
      </a>
      <button class="burger-action logout" id="burgerLogoutBtn">
        🚪 تسجيل الخروج
      </button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   ★ logout محلي — يشتغل بدون ملف خارجي
===================================================== */
function logout(skipRedirect) {
  try {
    sessionStorage.clear();
    localStorage.removeItem('borsa_admin');
    localStorage.removeItem('borsa_user');
  } catch (e) {}
  if (!skipRedirect) {
    window.location.replace('login.html');
  }
}
window.logout = logout;
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB36BkwxS0RHWWHSNGA1rZ5EHjtaeynTEA",
  authDomain: "borsa-b77a3.firebaseapp.com",
  projectId: "borsa-b77a3",
  storageBucket: "borsa-b77a3.firebasestorage.app",
  messagingSenderId: "1029468057087",
  appId: "1:1029468057087:web:1bafa9ffad7f14d7a2cbca",
  measurementId: "G-NKBES9QEBK"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ========== شاشة التحميل ========== */
const loadingScreen = document.getElementById('loadingScreen');
const loadingBarFill = document.getElementById('loadingBarFill');
const phoneApp = document.getElementById('phoneApp');

function setProgress(p) {
  loadingBarFill.style.width = Math.min(100, Math.max(0, p)) + '%';
}
function hideLoadingScreen() {
  setProgress(100);
  setTimeout(() => {
    loadingScreen.classList.add('hide');
    phoneApp.style.display = 'flex';
    setTimeout(() => phoneApp.classList.add('show'), 50);
  }, 400);
}
setProgress(20);

/* ========== المستخدم الحالي ========== */
const SUPER_ADMIN_NAME = 'BasharBahaa77';
let adminName = sessionStorage.getItem('borsa_admin') || '';
let currentType = (sessionStorage.getItem('borsa_admin_type') || '').toLowerCase();
let adminId = sessionStorage.getItem('borsa_admin_id') || '';

if (adminName.toLowerCase() === SUPER_ADMIN_NAME.toLowerCase()) currentType = 'admin';
const isSuperAdmin = (currentType === 'admin');

/* ★★★ التحقق من حالة الحساب (للمستخدمين فقط) ★★★ */
async function checkUserStatusAndLogout() {
  // المشرف الأساسي معفي
  if (isSuperAdmin) return false;
  // لو مفيش id → مش مشكلة
  if (!adminId) return false;

  try {
    const snap = await getDoc(doc(db, 'users', adminId));
    if (!snap.exists()) {
      showReasonAndLogout(
        'deleted',
        'تم حذف حسابك',
        'تم حذف حسابك نهائيًا من النظام. لا يمكنك الدخول مرة أخرى.'
      );
      return true;
    }

    const data = snap.data();
    const status = (data.status || 'active').toLowerCase();

    if (status === 'disabled') {
      showReasonAndLogout(
        'disabled',
        'تم تعطيل حسابك',
        'تم تعطيل حسابك مؤقتًا من قبل الإدارة. يرجى التواصل مع الدعم لمعرفة السبب.'
      );
      return true;
    }

    if (status === 'banned') {
      showReasonAndLogout(
        'banned',
        'تم حظر حسابك',
        'تم حظر حسابك نهائيًا من قبل الإدارة. لا يمكنك الدخول مرة أخرى.'
      );
      return true;
    }

    if (status === 'deleted') {
      showReasonAndLogout(
        'deleted',
        'تم حذف حسابك',
        'تم حذف حسابك نهائيًا من النظام.'
      );
      return true;
    }

    return false;

  } catch (e) {
    console.warn('status check failed:', e);
    return false;
  }
}

/* ========== Modal السبب ========== */
const reasonModal = document.getElementById('reasonModal');
const reasonIcon = document.getElementById('reasonIcon');
const reasonTitle = document.getElementById('reasonTitle');
const reasonText = document.getElementById('reasonText');
const reasonBtn = document.getElementById('reasonBtn');

function showReasonAndLogout(type, title, text) {
  reasonIcon.className = 'reason-icon ' + type;
  if (type === 'disabled') reasonIcon.textContent = '⏸️';
  else if (type === 'banned') reasonIcon.textContent = '🚫';
  else if (type === 'deleted') reasonIcon.textContent = '🗑️';
  else reasonIcon.textContent = '⚠️';

  reasonTitle.textContent = title;
  reasonText.textContent = text;
  reasonModal.classList.add('show');

  // سجّل خروج فوري
  logout(true); // true = بدون تحويل
}

reasonBtn.onclick = () => {
  window.location.replace('login.html');
};

/* ========== تعبئة البيانات ========== */
document.getElementById('adminName').textContent = adminName || 'مستخدم';
document.getElementById('welcomeSub').textContent = isSuperAdmin
  ? 'أنت المشرف الأساسي — لديك كامل الصلاحيات.'
  : 'مرحباً بك، الأزرار المتاحة حسب صلاحياتك.';

document.getElementById('burgerUsername').textContent = adminName || 'مستخدم';
document.getElementById('burgerRole').textContent = isSuperAdmin ? 'مشرف أساسي' : 'مستخدم';
document.getElementById('burgerAvatar').textContent = (adminName || 'م').charAt(0).toUpperCase();

/* ========== أزرار الخروج ========== */
document.getElementById('logoutBtn').onclick = () => logout();
document.getElementById('burgerLogoutBtn').onclick = () => logout();

/* ========== إظهار زر الإعدادات ========== */
if (isSuperAdmin) {
  document.getElementById('settingsBtn').style.display = 'flex';
  document.getElementById('burgerSettingsBtn').style.display = 'flex';
}

/* =====================================================
   الأزرار الافتراضية
===================================================== */
const DEFAULT_ACTIONS = [
  { id: 'd1', name: 'الأسهم',   icon: '💹', page: 'ashom.html' },
  { id: 'd2', name: 'التوصيات', icon: '💡', page: 'tawseat.html' },
  { id: 'd3', name: 'المجتمع',  icon: '💬', page: 'community.html' },
  { id: 'd4', name: 'التواصل',  icon: '📞', page: 'chatt.html' },
  { id: 'd5', name: 'الإعدادات',icon: '⚙️', page: 'settings.html' },
  { id: 'd6', name: 'حسابي',    icon: '👤', page: 'user.html' }
];

/* =====================================================
   تحميل الإعدادات
===================================================== */
async function loadSiteSettings() {
  let buttons = DEFAULT_ACTIONS;
  try {
    setProgress(40);
    const snap = await getDoc(doc(db, 'settings', 'site'));

    if (snap.exists()) {
      const s = snap.data();

      if (s.logoUrl) {
        await new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            document.getElementById('loadingLogo').src = s.logoUrl;
            document.getElementById('topLogo').src = s.logoUrl;
            document.getElementById('burgerLogo').src = s.logoUrl;
            const fav = document.getElementById('siteFavicon');
            const apple = document.getElementById('siteAppleIcon');
            if (fav) fav.href = s.logoUrl;
            if (apple) apple.href = s.logoUrl;
            resolve();
          };
          img.onerror = () => resolve();
          img.src = s.logoUrl;
        });
      }

      if (s.siteName) {
        const fullName = s.siteName;
        const accent = s.siteNameAccent || '';
        const buildName = (el) => {
          if (accent && fullName.includes(accent)) {
            const parts = fullName.split(accent);
            const before = parts[0].trim();
            const after = parts.slice(1).join(accent).trim();
            el.innerHTML = `${escapeHtml(before)} <span>${escapeHtml(accent)}</span>${after ? ' ' + escapeHtml(after) : ''}`;
          } else {
            el.textContent = fullName;
          }
        };
        buildName(document.getElementById('loadingBrand'));
        buildName(document.getElementById('topName'));
        buildName(document.getElementById('burgerName'));
        document.title = fullName + ' - الرئيسية';
      }

      if (Array.isArray(s.userButtons) && s.userButtons.length) {
        buttons = s.userButtons;
      }
    }

    setProgress(75);
  } catch (e) {
    console.warn('settings load failed:', e);
    setProgress(75);
  }

  renderActions(buttons);
  setupBurgerLogic(buttons);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderActions(buttons) {
  const grid = document.getElementById('actionsGrid');
  grid.innerHTML = '';

  let visible = buttons;

  if (!visible.length) {
    grid.innerHTML = '<div class="empty-state">لا توجد أزرار بعد</div>';
    return;
  }

  visible.forEach(b => {
    const a = document.createElement('a');
    a.href = b.page || '#';
    a.className = 'action-btn';
    a.innerHTML = `
      <span class="ico">${escapeHtml(b.icon || '📌')}</span>
      <span class="lbl">${escapeHtml(b.name || 'زر')}</span>
    `;
    grid.appendChild(a);
  });
}

/* =====================================================
   البرجر
===================================================== */
function setupBurgerLogic(buttons) {
  const burgerBtn = document.getElementById('burgerBtn');
  const burgerMenu = document.getElementById('burgerMenu');
  const burgerClose = document.getElementById('burgerClose');
  const burgerNav = document.getElementById('burgerNav');

  let visible = buttons;

  burgerNav.innerHTML = '';
  visible.forEach(b => {
    const item = document.createElement('a');
    item.href = b.page || '#';
    item.className = 'burger-nav-item';
    item.innerHTML = `
      <div class="bn-icon">${escapeHtml(b.icon || '📌')}</div>
      <div class="bn-lbl">${escapeHtml(b.name || 'زر')}</div>
      <div class="bn-arrow">‹</div>
    `;
    burgerNav.appendChild(item);
  });

  function shouldShowBurger() {
    const w = window.innerWidth;
    const count = visible.length;
    if (w < 768) return count > 4;
    if (w < 1024) return count > 4;
    if (w < 1440) return count > 8;
    return count > 10;
  }

  function filterActionsGrid() {
    const grid = document.getElementById('actionsGrid');
    const w = window.innerWidth;
    let maxVisible = 4;
    if (w >= 1440) maxVisible = 10;
    else if (w >= 1024) maxVisible = 8;
    else if (w >= 768) maxVisible = 4;
    else maxVisible = 4;

    const allBtns = grid.querySelectorAll('.action-btn');
    allBtns.forEach((btn, idx) => {
      btn.style.display = (idx < maxVisible) ? '' : 'none';
    });
  }

  function updateUI() {
    const show = shouldShowBurger();
    burgerBtn.style.display = show ? 'flex' : 'none';
    filterActionsGrid();

    if (!show && burgerMenu.classList.contains('open')) {
      burgerMenu.classList.remove('open');
      burgerBtn.classList.remove('open');
    }
  }

  burgerBtn.onclick = () => {
    burgerMenu.classList.add('open');
    burgerBtn.classList.add('open');
  };
  burgerClose.onclick = () => {
    burgerMenu.classList.remove('open');
    burgerBtn.classList.remove('open');
  };
  burgerMenu.onclick = (e) => {
    if (e.target === burgerMenu) {
      burgerMenu.classList.remove('open');
      burgerBtn.classList.remove('open');
    }
  };

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(updateUI, 150);
  });

  updateUI();
}

/* =====================================================
   الإحصائيات
===================================================== */
async function countCollection(name, filterFn = null) {
  try {
    const snap = await getDocs(collection(db, name));
    let items = [];
    snap.forEach(d => items.push({ id: d.id, ...d.data() }));
    if (filterFn) items = items.filter(filterFn);
    return items.length;
  } catch (e) {
    return 0;
  }
}

function setStat(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = value;
  el.classList.remove('loading');
}

async function loadStats() {
  try {
    setProgress(85);
    const stocks = await countCollection('stocks', s => s.isActive !== false);
    setStat('statStocks', stocks);
    const recs = await countCollection('recommendations', r => r.isActive !== false);
    setStat('statRecommend', recs);
    setProgress(95);
  } catch (e) {
    setStat('statStocks', 0);
    setStat('statRecommend', 0);
  }
}

/* =====================================================
   بدء التشغيل
===================================================== */
(async () => {
  // ★ أول حاجة: تحقق من حالة الحساب
  const wasLoggedOut = await checkUserStatusAndLogout();
  if (wasLoggedOut) return;

  await loadSiteSettings();
  await loadStats();
  setTimeout(hideLoadingScreen, 400);

  // ★ كل 60 ثانية: تحقق من الحالة تلقائيًا (عشان لو المشرف عطّلك وأنت داخل)
  setInterval(async () => {
    const wasLogged = await checkUserStatusAndLogout();
    if (wasLogged) {
      // امنع أي نشاط
      document.body.style.pointerEvents = 'none';
    }
  }, 60000);
})();

/* تحديث الإحصائيات عند العودة */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    checkUserStatusAndLogout();
    loadStats();
  }
});

/* PWA */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
