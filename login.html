<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>رسائلنا - تسجيل الدخول</title>
    
    <!-- ====== PWA ====== -->
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="رسائلنا" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#D4A08C" />
    
    <!-- ====== Firebase ====== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- ====== Font Awesome ====== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- ====== Google Font ====== -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            background: linear-gradient(145deg, #FDF6F0 0%, #F5E6D3 50%, #EDD4C0 100%);
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '🌿';
            position: absolute;
            top: 5%;
            right: 5%;
            font-size: 120px;
            opacity: 0.06;
            transform: rotate(15deg);
        }
        body::after {
            content: '🕊️';
            position: absolute;
            bottom: 5%;
            left: 5%;
            font-size: 100px;
            opacity: 0.05;
            transform: rotate(-10deg);
        }
        
        .login-card {
            background: rgba(255, 252, 248, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px 48px 32px 32px;
            padding: 36px 28px 34px;
            max-width: 420px;
            width: 100%;
            box-shadow: 
                0 30px 80px rgba(180, 130, 100, 0.15),
                0 10px 30px rgba(180, 130, 100, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: 0.3s;
            position: relative;
            z-index: 1;
        }
        
        .app-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .app-icon i {
            font-size: 42px;
            color: #D4A08C;
            background: linear-gradient(135deg, rgba(212, 160, 140, 0.15), rgba(212, 160, 140, 0.05));
            padding: 16px;
            border-radius: 24px;
            box-shadow: 0 4px 16px rgba(212, 160, 140, 0.12);
        }
        .app-icon h1 {
            color: #3D2C20;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .app-icon h1 span {
            color: #D4A08C;
            font-weight: 300;
        }
        .subhead {
            text-align: center;
            color: #B8A090;
            font-size: 14px;
            margin-top: -4px;
            margin-bottom: 24px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .subhead i {
            margin: 0 4px;
            color: #D4A08C;
            font-size: 12px;
        }
        
        .tabs {
            display: flex;
            background: rgba(212, 160, 140, 0.08);
            border-radius: 60px;
            padding: 5px;
            margin-bottom: 24px;
            border: 1px solid rgba(212, 160, 140, 0.10);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            color: #B8A090;
            font-size: 15px;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.3px;
            user-select: none;
            -webkit-user-select: none;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #D4A08C, #C4907C);
            color: #FFFFFF;
            box-shadow: 0 6px 20px rgba(212, 160, 140, 0.30);
        }
        .tab-btn:hover:not(.active) { 
            color: #3D2C20; 
        }
        .tab-btn:active {
            transform: scale(0.96);
        }
        
        .form-container {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fade 0.25s ease;
        }
        .form-container.active {
            display: flex;
        }
        
        @keyframes fade { 
            from { opacity: 0.3; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .input-group {
            position: relative;
            width: 100%;
        }
        .input-group i:not(.toggle-pwd) {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #C4B0A0;
            font-size: 18px;
            pointer-events: none;
            transition: 0.3s;
        }
        .input-group input {
            width: 100%;
            padding: 16px 50px 16px 50px;
            background: rgba(255, 252, 248, 0.7);
            border: 2px solid rgba(212, 160, 140, 0.12);
            border-radius: 40px;
            color: #3D2C20;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            font-weight: 400;
            -webkit-appearance: none;
            appearance: none;
        }
        .input-group input::placeholder { 
            color: #C4B0A0; 
            font-weight: 300; 
        }
        .input-group input:focus {
            border-color: #D4A08C;
            background: #FFFFFF;
            box-shadow: 0 0 0 6px rgba(212, 160, 140, 0.06);
        }
        .input-group input:focus + i,
        .input-group input:focus ~ i {
            color: #D4A08C;
        }
        .input-group input[dir="ltr"] { 
            text-align: left; 
        }
        
        .toggle-pwd {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #C4B0A0;
            font-size: 20px;
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 30px;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
        }
        .toggle-pwd:hover { 
            color: #D4A08C; 
            background: rgba(212, 160, 140, 0.08);
        }
        .toggle-pwd:active {
            transform: translateY(-50%) scale(0.92);
            background: rgba(212, 160, 140, 0.15);
        }
        .toggle-pwd i {
            font-size: 20px;
            pointer-events: none;
        }
        
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #D4A08C, #C4907C);
            color: #FFFFFF;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 28px rgba(212, 160, 140, 0.30);
            letter-spacing: 0.5px;
            margin-top: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 36px rgba(212, 160, 140, 0.40);
        }
        .btn-primary:active { 
            transform: scale(0.97) translateY(0);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-primary .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .btn-primary.loading .spinner {
            display: block;
        }
        .btn-primary.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .message-box {
            padding: 12px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            display: none;
            margin-top: -6px;
        }
        .message-box.error {
            background: rgba(214, 123, 123, 0.08);
            color: #C87A7A;
            border: 1px solid rgba(214, 123, 123, 0.12);
            display: block;
        }
        .message-box.success {
            background: rgba(123, 214, 160, 0.10);
            color: #6FAF8A;
            border: 1px solid rgba(123, 214, 160, 0.12);
            display: block;
        }
        
        .switch-text {
            text-align: center;
            color: #C4B0A0;
            font-size: 14px;
            margin-top: 12px;
        }
        .switch-text span {
            color: #D4A08C;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 8px;
            border-radius: 20px;
        }
        .switch-text span:hover { 
            color: #B8806A; 
            background: rgba(212, 160, 140, 0.08);
        }
        
        .pwa-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            opacity: 0.25;
            font-size: 12px;
            color: #B8A090;
        }
        .pwa-badge i { font-size: 16px; }
        
        @media (max-width: 480px) {
            .login-card { 
                padding: 28px 18px 32px; 
                border-radius: 36px; 
            }
            .app-icon i { font-size: 34px; padding: 12px; }
            .app-icon h1 { font-size: 28px; }
            .input-group input { 
                padding: 14px 44px 14px 44px; 
                font-size: 15px; 
            }
            .toggle-pwd {
                left: 8px;
                padding: 6px 8px;
                min-width: 40px;
                min-height: 40px;
            }
            .toggle-pwd i { font-size: 18px; }
        }
        
        input[type="password"]::-ms-reveal,
        input[type="password"]::-webkit-contacts-auto-fill-button { 
            display: none; 
        }
        
        /* منع التحديد */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    
    <div class="app-icon">
        <i class="fas fa-feather-alt"></i>
        <h1>رسائل<span>نا</span></h1>
    </div>
    <div class="subhead">
        <i class="fas fa-circle" style="font-size:6px;"></i>
        تحدث بحرية
        <i class="fas fa-circle" style="font-size:6px;"></i>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" data-tab="login" id="loginTab">تسجيل الدخول</button>
        <button class="tab-btn" data-tab="signup" id="signupTab">إنشاء حساب</button>
    </div>
    
    <!-- ====== تسجيل الدخول ====== -->
    <div id="loginForm" class="form-container active">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="loginUsername" placeholder="اسم المستخدم" dir="auto" autocomplete="username" />
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="كلمة السر" autocomplete="current-password" />
            <button class="toggle-pwd" type="button" onclick="togglePassword('loginPassword', this)">
                <i class="fas fa-eye"></i>
            </button>
        </div>
        <div id="loginMessage" class="message-box"></div>
        <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
            <span class="spinner"></span>
            <span class="btn-text"><i class="fas fa-sign-in-alt" style="margin-left: 10px;"></i> تسجيل الدخول</span>
        </button>
        <div class="switch-text">
            ليس لديك حساب؟ <span onclick="switchTab('signup')">إنشاء حساب جديد</span>
        </div>
    </div>
    
    <!-- ====== إنشاء حساب ====== -->
    <div id="signupForm" class="form-container">
        <div class="input-group">
            <i class="fas fa-user-plus"></i>
            <input type="text" id="signupUsername" placeholder="اسم المستخدم" dir="auto" autocomplete="username" />
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="signupPassword" placeholder="كلمة السر (6 أحرف على الأقل)" autocomplete="new-password" />
            <button class="toggle-pwd" type="button" onclick="togglePassword('signupPassword', this)">
                <i class="fas fa-eye"></i>
            </button>
        </div>
        <div id="signupMessage" class="message-box"></div>
        <button class="btn-primary" id="signupBtn" onclick="handleSignup()">
            <span class="spinner"></span>
            <span class="btn-text"><i class="fas fa-user-check" style="margin-left: 10px;"></i> إنشاء حساب</span>
        </button>
        <div class="switch-text">
            لديك حساب؟ <span onclick="switchTab('login')">تسجيل الدخول</span>
        </div>
    </div>
    
    <div class="pwa-badge">
        <i class="fas fa-mobile-alt"></i>
        <span>تثبيت على هاتفك</span>
        <i class="fas fa-arrow-down"></i>
    </div>
</div>

<script>
    // ====== Firebase ======
    const firebaseConfig = {
        apiKey: "AIzaSyBPRXdX-2O76F4-Q553GVY3G0fMsevaQCE",
        authDomain: "bbbb-1135e.firebaseapp.com",
        projectId: "bbbb-1135e",
        storageBucket: "bbbb-1135e.firebasestorage.app",
        messagingSenderId: "337845840358",
        appId: "1:337845840358:web:bcca87af66db9d0c458e27",
        measurementId: "G-2HNLLZD42P"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    let isProcessing = false;
    
    // ====== التبويبات ======
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
        
        if (tab === 'login') {
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('loginForm').classList.add('active');
            clearMessages();
            document.getElementById('loginUsername').focus();
        } else {
            document.getElementById('signupTab').classList.add('active');
            document.getElementById('signupForm').classList.add('active');
            clearMessages();
            document.getElementById('signupUsername').focus();
        }
    }
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            switchTab(this.dataset.tab);
        });
    });
    
    // ====== إظهار/إخفاء كلمة السر ======
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
        input.focus();
    }
    
    // ====== الرسائل ======
    function showMessage(containerId, text, type = 'error') {
        const box = document.getElementById(containerId);
        box.textContent = text;
        box.className = 'message-box ' + type;
        box.style.display = 'block';
    }
    
    function clearMessages() {
        document.querySelectorAll('.message-box').forEach(box => {
            box.style.display = 'none';
            box.className = 'message-box';
        });
    }
    
    // ====== تعطيل/تفعيل الأزرار ======
    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        if (loading) {
            btn.classList.add('loading');
            btn.disabled = true;
        } else {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    }
    
    // ====== إنشاء حساب ======
    async function handleSignup() {
        if (isProcessing) return;
        isProcessing = true;
        
        const username = document.getElementById('signupUsername').value.trim();
        const password = document.getElementById('signupPassword').value.trim();
        const msgBox = 'signupMessage';
        
        clearMessages();
        setLoading('signupBtn', true);
        
        if (!username || !password) {
            showMessage(msgBox, '✖️ الرجاء ملء جميع الحقول', 'error');
            setLoading('signupBtn', false);
            isProcessing = false;
            return;
        }
        if (username.length < 3) {
            showMessage(msgBox, '✖️ اسم المستخدم يجب أن يكون 3 أحرف على الأقل', 'error');
            setLoading('signupBtn', false);
            isProcessing = false;
            return;
        }
        if (password.length < 6) {
            showMessage(msgBox, '✖️ كلمة السر يجب أن تكون 6 أحرف على الأقل', 'error');
            setLoading('signupBtn', false);
            isProcessing = false;
            return;
        }
        
        try {
            // التحقق من وجود اسم المستخدم
            const snapshot = await db.collection('users')
                .where('username', '==', username)
                .get();
            
            if (!snapshot.empty) {
                showMessage(msgBox, '⚠️ اسم المستخدم موجود بالفعل، اختر اسماً آخر', 'error');
                setLoading('signupBtn', false);
                isProcessing = false;
                return;
            }
            
            // إنشاء الحساب
            await db.collection('users').add({
                username: username,
                password: password,
                fullName: '',
                birthDate: '',
                online: false,
                isAdmin: false,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            showMessage(msgBox, '✅ تم إنشاء الحساب بنجاح! جاري تسجيل الدخول...', 'success');
            
            // تسجيل الدخول تلقائياً
            setTimeout(async () => {
                try {
                    const loginSnapshot = await db.collection('users')
                        .where('username', '==', username)
                        .where('password', '==', password)
                        .get();
                    
                    if (!loginSnapshot.empty) {
                        const doc = loginSnapshot.docs[0];
                        const userData = doc.data();
                        const user = {
                            id: doc.id,
                            username: userData.username,
                            ...userData
                        };
                        
                        await db.collection('users').doc(doc.id).update({
                            online: true,
                            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        
                        localStorage.setItem('chatUser', JSON.stringify(user));
                        window.location.href = 'index.html';
                    }
                } catch (e) {
                    showMessage(msgBox, '❌ تم إنشاء الحساب لكن فشل تسجيل الدخول التلقائي', 'error');
                    setLoading('signupBtn', false);
                    isProcessing = false;
                }
            }, 800);
            
        } catch (err) {
            console.error(err);
            showMessage(msgBox, '❌ فشل إنشاء الحساب: ' + err.message, 'error');
            setLoading('signupBtn', false);
            isProcessing = false;
        }
    }
    
    // ====== تسجيل الدخول ======
    async function handleLogin() {
        if (isProcessing) return;
        isProcessing = true;
        
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const msgBox = 'loginMessage';
        
        clearMessages();
        setLoading('loginBtn', true);
        
        if (!username || !password) {
            showMessage(msgBox, '✖️ الرجاء إدخال اسم المستخدم وكلمة السر', 'error');
            setLoading('loginBtn', false);
            isProcessing = false;
            return;
        }
        
        try {
            const snapshot = await db.collection('users')
                .where('username', '==', username)
                .where('password', '==', password)
                .get();
            
            if (snapshot.empty) {
                showMessage(msgBox, '❌ اسم المستخدم أو كلمة السر غير صحيحة', 'error');
                setLoading('loginBtn', false);
                isProcessing = false;
                return;
            }
            
            const doc = snapshot.docs[0];
            const userData = doc.data();
            const user = {
                id: doc.id,
                username: userData.username,
                ...userData
            };
            
            await db.collection('users').doc(doc.id).update({
                online: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            localStorage.setItem('chatUser', JSON.stringify(user));
            
            showMessage(msgBox, '✅ جارٍ التوجيه...', 'success');
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 400);
            
        } catch (err) {
            console.error(err);
            showMessage(msgBox, '❌ خطأ في تسجيل الدخول: ' + err.message, 'error');
            setLoading('loginBtn', false);
            isProcessing = false;
        }
    }
    
    // ====== التحقق من جلسة سابقة ======
    (function checkSession() {
        const saved = localStorage.getItem('chatUser');
        if (saved) {
            try {
                const user = JSON.parse(saved);
                if (user.id) {
                    db.collection('users').doc(user.id).update({
                        online: true,
                        lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch(() => {});
                }
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 300);
            } catch (e) {
                localStorage.removeItem('chatUser');
            }
        }
    })();
    
    // ====== Enter ======
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const activeForm = document.querySelector('.form-container.active');
            if (activeForm) {
                const btn = activeForm.querySelector('.btn-primary');
                if (btn) btn.click();
            }
        }
    });
    
    // ====== تسجيل Service Worker ======
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('✅ Service Worker مسجل'))
            .catch(() => console.log('⚠️ فشل تسجيل Service Worker'));
    }
    
    console.log('📱 رسائلنا — نسخة PWA ✅');
    console.log('🕊️ تحدث بحرية');
</script>

</body>
</html>
