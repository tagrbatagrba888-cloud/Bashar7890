<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { min-height:100%; font-family:'Cairo', sans-serif; background:#000; overflow-x:hidden; }
  body {
    min-height:100vh;
    display:flex; justify-content:center; align-items:flex-start;
    background:radial-gradient(circle at 50% 0%, #0f2f4a 0%, #0a1929 40%, #000 100%);
  }

  .loading-screen {
    position:fixed; inset:0; z-index:9999;
    background:radial-gradient(circle at 50% 30%, #0f2f4a 0%, #0a1929 40%, #000 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    transition:opacity .6s ease, visibility .6s ease;
    overflow:hidden;
  }
  .loading-screen.hide { opacity:0; visibility:hidden; pointer-events:none; }
  .loading-content {
    position:relative; z-index:2;
    display:flex; flex-direction:column;
    align-items:center; gap:22px;
  }
  .logo-loader {
    position:relative; width:160px; height:160px;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-loader::before {
    content:''; position:absolute; inset:0;
    border-radius:50%; border:3px solid transparent;
    border-top-color:#1e90ff; border-right-color:#1e90ff;
    animation:spinRing 1.5s linear infinite;
  }
  @keyframes spinRing { to { transform:rotate(360deg); } }
  .loading-logo {
    width:110px; height:110px; border-radius:50%; object-fit:cover;
    border:3px solid rgba(30,144,255,.4);
  }
  .loading-brand {
    font-size:28px; font-weight:900; color:#fff;
  }
  .loading-brand span { color:#1e90ff; }
  .loading-sub { color:#8fb3d9; font-size:13px; font-weight:600; }
  .loading-bar {
    width:220px; height:4px; background:rgba(255,255,255,.08);
    border-radius:2px; overflow:hidden;
  }
  .loading-bar-fill {
    height:100%;
    background:linear-gradient(90deg, #0066cc, #1e90ff, #6bb7ff);
    width:0%; transition:width .4s ease;
    border-radius:2px;
  }
  .loading-footer {
    position:absolute; bottom:30px; color:#4d6d8f;
    font-size:11px; letter-spacing:1px; font-weight:600;
  }

  .phone {
    position:relative;
    width:100%; max-width:430px; min-height:100vh;
    background:linear-gradient(180deg,#0a1929 0%,#06121e 100%);
    display:flex; flex-direction:column; overflow:hidden;
    opacity:0; transition:opacity .5s ease;
  }
  .phone.show { opacity:1; }

  .logo-wrap { padding:24px 20px 8px; text-align:center; }
  .logo-wrap img {
    width:86px; height:86px; border-radius:50%; object-fit:cover;
    border:3px solid #1e90ff; box-shadow:0 0 25px rgba(30,144,255,.6);
  }
  .brand { margin-top:10px; font-size:22px; font-weight:900; color:#fff; letter-spacing:1px; }
  .brand span { color:#1e90ff; }
  .sub { margin-top:4px; font-size:12px; color:#8fb3d9; font-weight:600; }

  .tabs {
    display:flex; margin:14px 16px 0;
    padding:4px; gap:4px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(30,144,255,.2);
    border-radius:14px;
  }
  .tab {
    flex:1; padding:10px;
    background:transparent; border:none;
    color:#8fb3d9;
    font-family:'Cairo',sans-serif;
    font-size:13px; font-weight:700;
    cursor:pointer; border-radius:11px;
  }
  .tab.active {
    background:linear-gradient(135deg,#1e90ff,#0066cc);
    color:#fff;
  }
  .content { flex:1; padding:16px; overflow-y:auto; }
  .form-view { display:none; }
  .form-view.active { display:block; }

  .card {
    padding:22px 20px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(30,144,255,.25);
    border-radius:20px;
  }
  .card h2 { color:#fff; font-size:17px; margin-bottom:16px; text-align:center; font-weight:900; }
  .card h2 span { color:#1e90ff; }

  .field { position:relative; margin-bottom:12px; }
  .field label { display:block; color:#9fc1e3; font-size:12px; margin-bottom:5px; font-weight:600; }
  .field .input-wrap { position:relative; }
  .field input {
    width:100%; padding:12px 42px 12px 14px;
    background:#0d2033; border:1.5px solid #1b3a5c;
    border-radius:11px; color:#fff; font-size:14px;
    font-family:'Cairo',sans-serif; outline:none;

  .field .help.ok { color:#3ddc84; }

  .verify-row { display:flex; gap:6px; }

  .verify-sm-btn {

    background:linear-gradient(135deg,#28c878,#1a9e5a);
    color:#fff; border:none; border-radius:11px;
    font-family:'Cairo',sans-serif; font-size:12px; font-weight:700;

  .captcha-row { display:flex; gap:8px; align-items:stretch; }

  .captcha-canvas-wrap canvas { width:100%; height:100%; display:block; }
  .captcha-refresh {
    width:52px; background:rgba(30,144,255,.15);

    color:#6bb7ff; font-size:20px; cursor:pointer;

  .btn {
    width:100%; padding:14px;
    border:none; border-radius:12px;

  .forgot-btn {
    width:100%; padding:11px; background:transparent;
    color:#6bb7ff; border:1.5px dashed rgba(30,144,255,.4);
    border-radius:11px; font-family:'Cairo',sans-serif;
    font-size:13px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;

  .divider { display:flex; align-items:center; gap:10px; margin:14px 0 10px; }

  .msg {

  .msg.err { display:block; background:rgba(255,60,60,.12); color:#ff6b6b; border:1px solid rgba(255,60,60,.3); }
  .msg.ok  { display:block; background:rgba(40,200,120,.12); color:#3ddc84; border:1px solid rgba(40,200,120,.3); }

  .loader {
    display:inline-block; width:14px; height:14px;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%;
    animation:spin .7s linear infinite;

  }

  .footer { text-align:center; padding:14px; font-size:11px; color:#4d6d8f; }

  .modal-overlay {
    position:fixed; inset:0;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center;
    padding:16px; z-index:100; overflow-y:auto;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    width:100%; max-width:480px;
    background:linear-gradient(180deg,#0d1f33,#0a1929);
    border:1px solid rgba(30,144,255,.35);
    border-radius:22px; padding:22px 20px;
    max-height:92vh; overflow-y:auto; margin:auto;
  }
  .modal h3 { color:#fff; font-size:18px; font-weight:900; margin-bottom:6px; text-align:center; }
  .modal-sub { color:#8fb3d9; font-size:12.5px; text-align:center; margin-bottom:16px; font-weight:600; }
  .modal .field { margin-bottom:12px; }
  .modal-actions { display:flex; gap:10px; margin-top:16px; }
  .modal-btn {
    flex:1; padding:12px; border:none; border-radius:11px;
    font-family:'Cairo',sans-serif; font-size:14px; font-weight:700; cursor:pointer;
  }
  .modal-btn.primary { background:linear-gradient(135deg,#1e90ff,#0066cc); color:#fff; }
  .modal-btn.cancel { background:rgba(255,255,255,.06); color:#a8c8e8; border:1px solid rgba(255,255,255,.1); }

  @media (min-width:768px) {
    body { padding:30px; }

  }
  @media (min-width:1024px) {
    body { padding:40px 30px; }
    .phone { max-width:600px; }
  }
</style>

function saveSession(data, uid) {
  const sessionData = {
    borsa_admin: data.username || data.fullName || 'مستخدم',
    borsa_admin_id: uid,
    borsa_admin_type: (data.type || 'user').toLowerCase(),

  });

  console.log('✅ تم حفظ الجلسة:', sessionData);

/* ========== أدوات ========== */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function showMsg(el, text, type = 'err') {
  el.innerHTML = text;
  el.className = 'msg ' + type;
  setTimeout(() => { el.className = 'msg'; el.innerHTML = ''; }, 5000);
}

/* ========== تحميل الإعدادات ========== */
async function loadSiteSettings() {
  try {
    setProgress(30);
    const snap = await getDoc(doc(db, 'settings', 'site'));
    if (snap.exists()) {
      const s = snap.data();
      if (s.logoUrl) {
        document.getElementById('loadingLogo').src = s.logoUrl;
        document.getElementById('mainLogo').src = s.logoUrl;
        const fav = document.getElementById('siteFavicon');
        const apple = document.getElementById('siteAppleIcon');
        if (fav) fav.href = s.logoUrl;
        if (apple) apple.href = s.logoUrl;
      }
      if (s.siteName) {
        const fullName = s.siteName;
        const accent = s.siteNameAccent || '';
        const buildName = (el) => {
          if (accent && fullName.includes(accent)) {
            const parts = fullName.split(accent);
            const before = parts[0].trim();
            const after = parts.slice(1).join(accent).trim();
            el.innerHTML = `${escapeHtml(before)} <span>${escapeHtml(accent)}</span>${after ? ' ' + escapeHtml(after) : ''}`;
          } else {
            el.textContent = fullName;
          }
        };
        buildName(document.getElementById('loadingBrand'));
        buildName(document.getElementById('mainBrand'));
        document.title = fullName + ' - الدخول';
      }
    }
    setProgress(70);
  } catch (e) {
    console.warn('settings:', e);
    setProgress(70);
  }
}

/* ========== التبويبات ========== */
tabs.forEach(t => {
  t.onclick = () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    Object.values(views).forEach(v => v.classList.remove('active'));
    const target = t.dataset.tab;
    if (views[target]) views[target].classList.add('active');
  };
});

/* ========== العين ========== */
function bindEye(eyeId, iconId, inputId) {
  const eye = document.getElementById(eyeId);
  const icon = document.getElementById(iconId);
  const input = document.getElementById(inputId);
  if (!eye || !input) return;
  eye.onclick = () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    icon.innerHTML = show
      ? '<path d="M12 6c-3 0-5.5 1.7-7 4.5C6.5 13.3 9 15 12 15s5.5-1.7 7-4.5C17.5 7.7 15 6 12 6zm0 7a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zM2 4l18 16-1.3 1.4L1 5.4z"/>'
      : '<path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>';
  };
}

/* ========== CAPTCHA ========== */
function generateCaptcha() {
  const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  let text = '';
  for (let i = 0; i < 6; i++) text += chars.charAt(Math.floor(Math.random() * chars.length));
  captchaText = text;

  const canvas = document.getElementById('captchaCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = '#0d2033';
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 5; i++) {
    ctx.strokeStyle = `rgba(30,144,255,${0.15 + Math.random() * 0.3})`;
    ctx.lineWidth = 1 + Math.random() * 2;
    ctx.beginPath();
    ctx.moveTo(Math.random() * W, Math.random() * H);
    ctx.lineTo(Math.random() * W, Math.random() * H);
    ctx.stroke();
  }
  ctx.font = 'bold 26px Cairo, Arial';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const x = 20 + i * ((W - 40) / text.length);
    const y = H / 2 + (Math.random() - 0.5) * 8;
    ctx.fillStyle = `hsl(${Math.random() * 60 + 190}, 80%, 65%)`;
    ctx.fillText(ch, x, y);
  }
}
document.getElementById('captchaRefresh').onclick = generateCaptcha;
generateCaptcha();

/* ========== التحقق من اسم المستخدم ========== */
async function checkUsernameAvailable(username) {
  if (!username || username.length < 3) return { ok: false, reason: 'قصير جدًا' };
  if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) return { ok: false, reason: 'أحرف وأرقام و _ فقط' };
  const q = query(collection(db, USERS_COLLECTION), where('username', '==', username.toLowerCase()));
  const snap = await getDocs(q);
  if (!snap.empty) return { ok: false, reason: 'محجوز' };
  return { ok: true };
}

verifyUserBtn.onclick = async () => {
  const u = regUser.value.trim().toLowerCase();
  if (!u) { regUserHelp.textContent = '⚠️ اكتب اسم المستخدم'; regUserHelp.className = 'help err'; return; }
  verifyUserBtn.disabled = true;
  verifyUserBtn.textContent = '...';
  try {
    const res = await checkUsernameAvailable(u);
    if (res.ok) {
      usernameVerified = true;
      verifiedUsername = u;
      regUserHelp.textContent = '✅ متاح';
      regUserHelp.className = 'help ok';
    } else {
      usernameVerified = false;
      regUserHelp.textContent = '❌ ' + res.reason;
      regUserHelp.className = 'help err';
    }
  } catch {
    regUserHelp.textContent = '❌ فشل التحقق';
    regUserHelp.className = 'help err';
  } finally {
    verifyUserBtn.disabled = false;
    verifyUserBtn.textContent = 'تحقق';
  }
};

/* ========== كلمة السر ========== */
function validatePassword(pass) {
  if (pass.length < 8) return '8 أحرف على الأقل';
  if (!/[A-Za-z]/.test(pass)) return 'حرف واحد على الأقل';
  if (!/[0-9]/.test(pass)) return 'رقم واحد على الأقل';
  return null;
}

async function saveUserDoc(uid, data) {
  await setDoc(doc(db, USERS_COLLECTION, uid), {
    ...data,
    status: 'active',
    createdAt: serverTimestamp(),
    updatedAt: serverTimestamp()
  });
}

/* =====================================================
   ★★★ Register ★★★
===================================================== */
registerBtn.onclick = async () => {
  registerMsg.className = 'msg'; registerMsg.innerHTML = '';
  const full = regFull.value.trim();
  const user = regUser.value.trim().toLowerCase();
  const phone = regPhone.value.trim();
  const email = regEmail.value.trim().toLowerCase();
  const birth = regBirth.value;
  const pass = regPass.value;
  const pass2 = regPass2.value;
  const captcha = regCaptcha.value.trim();

  if (!full) { showMsg(registerMsg, '⚠️ الاسم مطلوب'); return; }
  if (!user) { showMsg(registerMsg, '⚠️ اسم المستخدم مطلوب'); return; }
  if (!usernameVerified || verifiedUsername !== user) {
    showMsg(registerMsg, '⚠️ اضغط "تحقق"'); return;
  }
  if (!/^01[0-9]{9}$/.test(phone)) { showMsg(registerMsg, '⚠️ رقم الهاتف غير صحيح'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMsg(registerMsg, '⚠️ البريد غير صحيح'); return; }
  if (!currentGender) { showMsg(registerMsg, '⚠️ اختر النوع'); return; }
  if (!birth) { showMsg(registerMsg, '⚠️ تاريخ الميلاد مطلوب'); return; }
  const pErr = validatePassword(pass);
  if (pErr) { showMsg(registerMsg, '⚠️ ' + pErr); return; }
  if (pass !== pass2) { showMsg(registerMsg, '⚠️ كلمتا السر غير متطابقتين'); return; }
  if (captcha.toUpperCase() !== captchaText) {
    showMsg(registerMsg, '⚠️ رمز التحقق غلط');
    generateCaptcha();
    regCaptcha.value = '';
    return;
  }

  registerBtn.disabled = true;
  registerBtn.innerHTML = 'جارٍ الإنشاء...<span class="loader"></span>';

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid = cred.user.uid;
    await updateProfile(cred.user, { displayName: full }).catch(() => {});

    const userData = {
      uid, fullName: full, username: user, phone, email,
      gender: currentGender, birthdate: birth,
      provider: 'local', password: pass
    };
    await saveUserDoc(uid, userData);
    saveSession(userData, uid);

    showMsg(registerMsg, '✅ تم! جارٍ التحويل...', 'ok');
    setTimeout(() => window.location.replace('index.html'), 1000);
  } catch (err) {
    console.error(err);
    let m = 'فشل الإنشاء';
    const code = err.code || '';
    if (code.includes('email-already-in-use')) m = '⚠️ البريد مستخدم';
    else if (code.includes('weak-password')) m = '⚠️ كلمة ضعيفة';
    else if (code.includes('invalid-email')) m = '⚠️ بريد غير صحيح';
    showMsg(registerMsg, m);
    registerBtn.disabled = false;
    registerBtn.textContent = 'إنشاء الحساب';
  }
};

/* =====================================================
   ★★★ Login ★★★
===================================================== */
loginBtn.onclick = async () => {
  loginMsg.className = 'msg'; loginMsg.innerHTML = '';
  const user = loginUser.value.trim().toLowerCase();
  const pass = loginPass.value;

  if (!user || !pass) { showMsg(loginMsg, '⚠️ اكتب اسم المستخدم وكلمة السر'); return; }

  loginBtn.disabled = true;
  loginBtn.innerHTML = 'جارٍ التحقق...<span class="loader"></span>';

  try {
    const q = query(collection(db, USERS_COLLECTION), where('username', '==', user));
    const snap = await getDocs(q);

    if (snap.empty) {
      showMsg(loginMsg, '❌ اسم المستخدم غير موجود');
      loginBtn.disabled = false;
      loginBtn.textContent = 'تسجيل الدخول';
      return;
    }

    const userDoc = snap.docs[0].data();
    const uid = snap.docs[0].id;
    const status = (userDoc.status || 'active').toLowerCase();

    if (status === 'disabled') {
      showMsg(loginMsg, '🔒 تم تعطيل حسابك');
      loginBtn.disabled = false;
      loginBtn.textContent = 'تسجيل الدخول';
      return;
    }
    if (status === 'banned') {
      showMsg(loginMsg, '🚫 تم حظر حسابك');
      loginBtn.disabled = false;
      loginBtn.textContent = 'تسجيل الدخول';
      return;
    }
    if (status === 'deleted') {
      showMsg(loginMsg, '🗑️ تم حذف حسابك');
      loginBtn.disabled = false;
      loginBtn.textContent = 'تسجيل الدخول';
      return;
    }
    if (userDoc.provider === 'google') {
      showMsg(loginMsg, 'ℹ️ سجّل بـ Google');
      loginBtn.disabled = false;
      loginBtn.textContent = 'تسجيل الدخول';
      return;
    }

    await signInWithEmailAndPassword(auth, userDoc.email, pass);

    if (!userDoc.password) {
      await updateDoc(doc(db, USERS_COLLECTION, uid), { password: pass }).catch(() => {});
    }

    saveSession(userDoc, uid);
    showMsg(loginMsg, '✅ جارٍ التحويل...', 'ok');
    setTimeout(() => window.location.replace('index.html'), 800);
  } catch (err) {
    console.error(err);
    let m = 'فشل تسجيل الدخول';
    const code = err.code || '';
    if (code.includes('wrong-password') || code.includes('invalid-credential')) m = '❌ كلمة السر غلط';
    else if (code.includes('too-many-requests')) m = '⚠️ حاول لاحقًا';
    showMsg(loginMsg, m);
    loginBtn.disabled = false;
    loginBtn.textContent = 'تسجيل الدخول';
  }
};

/* =====================================================
   ★★★ Google Sign-In — Popup ★★★
===================================================== */
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

async function processGoogleUser(user) {
  const uid = user.uid;

  try {
    const userSnap = await getDoc(doc(db, USERS_COLLECTION, uid));

    if (userSnap.exists()) {
      const data = userSnap.data();
      const status = (data.status || 'active').toLowerCase();

      if (status === 'disabled') { await signOut(auth); showMsg(loginMsg, '🔒 حسابك معطّل'); return; }
      if (status === 'banned')   { await signOut(auth); showMsg(loginMsg, '🚫 حسابك محظور'); return; }
      if (status === 'deleted')  { await signOut(auth); showMsg(loginMsg, '🗑️ حسابك محذوف'); return; }

      const hasFullData = data.fullName && data.username && data.phone && data.birthdate && data.gender;

      if (!hasFullData) {
        // ناقص → افتح المودال
        pendingGoogleUser = { uid, email: user.email, displayName: user.displayName || data.fullName || '' };

        gmFull.value = data.fullName || user.displayName || '';
        gmUser.value = data.username || '';
        gmPhone.value = data.phone || '';
        gmBirth.value = data.birthdate || '';

        if (data.gender) {
          currentGmGender = data.gender;
          document.querySelectorAll('.gender-opt[data-gm-gender]').forEach(el => {
            el.classList.toggle('selected', el.dataset.gmGender === data.gender);
          });
        }

        if (!gmUser.value) {
          let s = (user.email || '').split('@')[0].replace(/[^a-zA-Z0-9_]/g, '');
          if (s.length < 3) s = 'user' + Math.floor(Math.random() * 9999);
          gmUser.value = s.toLowerCase();
        }

        googleModal.classList.add('open');
        return;
      }

      saveSession(data, uid);
      window.location.replace('index.html');
      return;
    }

    // مستخدم جديد
    pendingGoogleUser = { uid, email: user.email, displayName: user.displayName || '' };
    gmFull.value = user.displayName || '';
    let s = (user.email || '').split('@')[0].replace(/[^a-zA-Z0-9_]/g, '');
    if (s.length < 3) s = 'user' + Math.floor(Math.random() * 9999);
    gmUser.value = s.toLowerCase();

    googleModal.classList.add('open');
  } catch (e) {
    console.error(e);
    showMsg(loginMsg, '❌ فشل تحميل البيانات');
  }
}

async function handleGoogleAuth() {
  showMsg(loginMsg, '⏳ جارٍ فتح Google...', 'ok');
  googleLoginBtn.disabled = true;
  googleRegisterBtn.disabled = true;

  try {
    const result = await signInWithPopup(auth, provider);

    if (result && result.user) {
      await processGoogleUser(result.user);
    } else {
      showMsg(loginMsg, '❌ لم يتم استقبال بيانات');
      googleLoginBtn.disabled = false;
      googleRegisterBtn.disabled = false;
    }
  } catch (err) {
    console.error(err);
    googleLoginBtn.disabled = false;
    googleRegisterBtn.disabled = false;

    let m = 'فشل تسجيل Google';
    const code = err.code || '';
    if (code.includes('popup-blocked')) m = '❌ المتصفح منع النافذة';
    else if (code.includes('popup-closed-by-user')) m = '⚠️ أغلقت النافذة';
    else if (code.includes('unauthorized-domain')) m = '❌ الدومين غير مصرح';
    else if (code.includes('operation-not-allowed')) m = '❌ Google غير مفعّل';
    else if (code.includes('network-request-failed')) m = '❌ تحقق من الإنترنت';
    else m = '❌ فشل: ' + code;

    showMsg(loginMsg, m);
  }
}

googleLoginBtn.onclick = handleGoogleAuth;
googleRegisterBtn.onclick = handleGoogleAuth;

/* ========== Modal — إكمال بيانات Google ========== */
gmCancelBtn.onclick = async () => {
  googleModal.classList.remove('open');
  if (pendingGoogleUser) await signOut(auth).catch(() => {});
  pendingGoogleUser = null;
};

gmSaveBtn.onclick = async () => {
  if (!pendingGoogleUser) return;
  const full = gmFull.value.trim();
  const user = gmUser.value.trim().toLowerCase();
  const phone = gmPhone.value.trim();
  const birth = gmBirth.value;

  if (!full) { alert('الاسم الكامل مطلوب'); return; }
  if (!user || !gmUsernameVerified || gmVerifiedUsername !== user) { alert('اضغط "تحقق"'); return; }
  if (!/^01[0-9]{9}$/.test(phone)) { alert('رقم الهاتف غير صحيح'); return; }
  if (!currentGmGender) { alert('اختر النوع'); return; }
  if (!birth) { alert('تاريخ الميلاد مطلوب'); return; }

  gmSaveBtn.disabled = true;
  gmSaveBtn.innerHTML = 'جارٍ الحفظ...<span class="loader"></span>';

  try {
    const userData = {
      uid: pendingGoogleUser.uid,
      fullName: full,
      username: user,
      phone,
      email: pendingGoogleUser.email,
      gender: currentGmGender,
      birthdate: birth,
      provider: 'google',
      password: '(Google)'
    };
    await saveUserDoc(pendingGoogleUser.uid, userData);
    saveSession(userData, pendingGoogleUser.uid);

    googleModal.classList.remove('open');
    window.location.replace('index.html');
  } catch (err) {
    console.error(err);
    alert('فشل الحفظ');
    gmSaveBtn.disabled = false;
    gmSaveBtn.textContent = 'حفظ';
  }
};
