<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>رسائلنا - الدردشة</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: linear-gradient(145deg, #FDF6F0 0%, #F5E6D3 50%, #EDD4C0 100%);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background: rgba(255, 252, 248, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 60px rgba(180, 130, 100, 0.10);
            border-left: 1px solid rgba(255,255,255,0.3);
            border-right: 1px solid rgba(255,255,255,0.3);
            overflow: hidden;
            margin: 0 auto;
        }
        
        /* ====== الهيدر ثابت تماماً ====== */
        .chat-header {
            position: relative;
            z-index: 999;
            background: rgba(255, 252, 248, 0.98);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(212, 160, 140, 0.10);
            flex-shrink: 0;
            min-height: 65px;
            width: 100%;
            box-shadow: 0 1px 8px rgba(0,0,0,0.04);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .back-btn {
            background: none;
            border: none;
            color: #B8A090;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: rgba(212, 160, 140, 0.08);
            color: #D4A08C;
        }
        
        /* ====== الاسم والصورة ثابتين ====== */
        .chat-user-info {
            flex: 1;
            min-width: 0;
            flex-shrink: 0;
            overflow: hidden;
        }
        .chat-user-info .name {
            font-size: 16px;
            font-weight: 600;
            color: #3D2C20;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-user-info .name .custom-name {
            color: #D4A08C;
            font-size: 12px;
            font-weight: 400;
        }
        .chat-user-info .status {
            font-size: 12px;
            color: #B8A090;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-user-info .status .online {
            color: #6FCF97;
        }
        .chat-user-info .status .offline {
            color: #BDBDBD;
        }
        
        .header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .header-actions button {
            background: none;
            border: none;
            color: #B8A090;
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:hover {
            background: rgba(212, 160, 140, 0.08);
            color: #D4A08C;
        }
        
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(212, 160, 140, 0.3);
            border-radius: 10px;
        }
        
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: msgIn 0.2s ease;
            position: relative;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-wrapper.sent {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-wrapper.received {
            align-self: flex-start;
            align-items: flex-start;
        }
        
        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
            max-width: 100%;
            box-shadow: 0 2px 8px rgba(180, 130, 100, 0.06);
            cursor: default;
            transition: 0.2s;
        }
        .message-wrapper.sent .message-bubble {
            background: linear-gradient(135deg, #D4A08C, #C4907C);
            color: #FFFFFF;
            border-bottom-left-radius: 6px;
        }
        .message-wrapper.received .message-bubble {
            background: rgba(255, 252, 248, 0.8);
            color: #3D2C20;
            border-bottom-right-radius: 6px;
            border: 1px solid rgba(212, 160, 140, 0.08);
        }
        
        .message-text {
            font-size: 15px;
            line-height: 1.4;
        }
        .message-text .edited-label {
            font-size: 10px;
            opacity: 0.6;
            margin-right: 4px;
        }
        .message-text .sending-label {
            font-size: 10px;
            opacity: 0.5;
            margin-right: 4px;
            color: #FFD700;
        }
        .message-text .deleted-label {
            font-size: 12px;
            opacity: 0.5;
            font-style: italic;
        }
        .message-text .file-name {
            font-size: 13px;
            font-weight: 500;
            display: block;
            margin-bottom: 4px;
        }
        .message-text .file-size {
            font-size: 11px;
            opacity: 0.6;
        }
        .message-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: flex-end;
        }
        .message-wrapper.sent .message-time {
            color: rgba(255, 255, 255, 0.7);
        }
        .message-wrapper.received .message-time {
            color: #B8A090;
        }
        
        .message-media {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .message-audio {
            width: 200px;
            height: 40px;
            border-radius: 12px;
            margin-bottom: 4px;
        }
        
        .status-label {
            font-size: 11px;
            font-weight: 500;
            margin-top: 2px;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
        }
        .message-wrapper.sent .status-label {
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.06);
        }
        .message-wrapper.received .status-label {
            color: #B8A090;
            background: rgba(212,160,140,0.06);
        }
        .status-label.read {
            color: #4A90D9 !important;
            background: rgba(74,144,217,0.08) !important;
        }
        .status-label.unread {
            color: #B8A090 !important;
        }
        .status-label.sending {
            color: #FFD700 !important;
            background: rgba(255,215,0,0.08) !important;
        }
        .status-label.failed {
            color: #FF6B6B !important;
            background: rgba(255,107,107,0.08) !important;
        }
        
        .reply-preview {
            display: none;
            background: rgba(212, 160, 140, 0.06);
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            border-right: 3px solid #D4A08C;
            width: 100%;
            max-width: 90%;
            flex-shrink: 0;
        }
        .reply-preview.active {
            display: block;
        }
        .reply-preview .reply-label {
            font-size: 11px;
            color: #D4A08C;
            font-weight: 600;
        }
        .reply-preview .reply-text {
            font-size: 13px;
            color: #B8A090;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reply-preview .reply-close {
            float: left;
            background: none;
            border: none;
            color: #B8A090;
            cursor: pointer;
            font-size: 16px;
        }
        
        .reply-to {
            background: rgba(255,255,255,0.08);
            padding: 6px 10px;
            border-radius: 10px;
            margin-bottom: 6px;
            border-right: 3px solid rgba(255,255,255,0.3);
        }
        .message-wrapper.received .reply-to {
            background: rgba(0,0,0,0.04);
            border-right-color: #D4A08C;
        }
        .reply-to .reply-sender {
            font-size: 11px;
            font-weight: 600;
            color: #D4A08C;
        }
        .reply-to .reply-text {
            font-size: 13px;
            opacity: 0.7;
            font-weight: 300;
        }
        
        .message-reactions {
            display: flex;
            gap: 2px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .reaction-emoji {
            font-size: 18px;
            background: rgba(255,255,255,0.06);
            padding: 2px 6px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
            line-height: 1.4;
        }
        .reaction-emoji:hover {
            background: rgba(255,255,255,0.12);
            transform: scale(1.05);
        }
        .reaction-emoji.active {
            background: rgba(212, 160, 140, 0.15);
            border-color: #D4A08C;
        }
        .message-wrapper.sent .reaction-emoji {
            background: rgba(255,255,255,0.10);
        }
        .message-wrapper.sent .reaction-emoji.active {
            background: rgba(255,255,255,0.20);
            border-color: rgba(255,255,255,0.3);
        }
        
        .reaction-popup {
            display: none;
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFFFFF;
            padding: 12px 16px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(61, 44, 32, 0.15);
            border: 1px solid rgba(212, 160, 140, 0.06);
            z-index: 1000;
            gap: 4px;
            flex-wrap: wrap;
            max-width: 90%;
            justify-content: center;
        }
        .reaction-popup.active {
            display: flex;
            animation: popUp 0.2s ease;
        }
        @keyframes popUp {
            from { opacity: 0; transform: translateX(-50%) scale(0.9); }
            to { opacity: 1; transform: translateX(-50%) scale(1); }
        }
        .reaction-popup .reaction-option {
            font-size: 28px;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 30px;
            transition: 0.2s;
            border: none;
            background: transparent;
            line-height: 1;
        }
        .reaction-popup .reaction-option:hover {
            transform: scale(1.3);
            background: rgba(212, 160, 140, 0.06);
        }
        .reaction-popup .close-reactions {
            background: none;
            border: none;
            color: #B8A090;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
        }
        .reaction-popup .close-reactions:hover {
            color: #3D2C20;
        }
        
        .message-actions-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(61, 44, 32, 0.3);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .message-actions-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .message-actions-box {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 24px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(61, 44, 32, 0.15);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-actions-box h3 {
            color: #3D2C20;
            font-size: 18px;
            margin-bottom: 16px;
            text-align: center;
        }
        .message-actions-box .action-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 18px;
            border: none;
            background: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #3D2C20;
            font-family: 'Cairo', sans-serif;
        }
        .message-actions-box .action-btn:hover {
            background: rgba(212, 160, 140, 0.06);
        }
        .message-actions-box .action-btn i {
            width: 24px;
            color: #D4A08C;
            font-size: 18px;
        }
        .message-actions-box .action-btn.danger i {
            color: #C87A7A;
        }
        .message-actions-box .action-btn.danger:hover {
            background: rgba(200, 122, 122, 0.06);
        }
        .message-actions-box .action-divider {
            height: 1px;
            background: rgba(212, 160, 140, 0.10);
            margin: 6px 0;
        }
        .message-actions-box .cancel-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: rgba(212, 160, 140, 0.06);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: #B8A090;
            margin-top: 8px;
            transition: 0.2s;
        }
        .message-actions-box .cancel-btn:hover {
            background: rgba(212, 160, 140, 0.10);
        }
        
        .edit-input-container {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFFFFF;
            border-radius: 24px;
            padding: 16px 20px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(61, 44, 32, 0.15);
            z-index: 1000;
            border: 1px solid rgba(212, 160, 140, 0.10);
            animation: slideUp 0.25s ease;
        }
        .edit-input-container.active {
            display: block;
        }
        .edit-input-container .edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .edit-input-container .edit-header span {
            color: #D4A08C;
            font-size: 14px;
            font-weight: 600;
        }
        .edit-input-container .edit-header button {
            background: none;
            border: none;
            color: #B8A090;
            font-size: 18px;
            cursor: pointer;
        }
        .edit-input-container .edit-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .edit-input-container .edit-row form {
            display: flex;
            gap: 10px;
            flex: 1;
            align-items: center;
        }
        .edit-input-container .edit-row input[type="search"] {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid rgba(212, 160, 140, 0.10);
            border-radius: 40px;
            font-size: 15px;
            outline: none;
            color: #3D2C20;
            background: rgba(245, 230, 211, 0.2);
            transition: 0.25s;
            width: 100%;
            min-width: 0;
            autocomplete: off;
            inputmode: text;
            autocorrect: off;
            autocapitalize: none;
            spellcheck: false;
            data-form-type: other;
            data-lpignore: true;
            data-1p-ignore: true;
        }
        .edit-input-container .edit-row input[type="search"]:focus {
            border-color: #D4A08C;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(212, 160, 140, 0.06);
        }
        .edit-input-container .edit-row input[type="search"]::-webkit-search-decoration,
        .edit-input-container .edit-row input[type="search"]::-webkit-search-cancel-button,
        .edit-input-container .edit-row input[type="search"]::-webkit-search-results-button,
        .edit-input-container .edit-row input[type="search"]::-webkit-search-results-decoration {
            display: none;
            -webkit-appearance: none;
        }
        .edit-input-container .edit-row button {
            background: linear-gradient(135deg, #D4A08C, #C4907C);
            border: none;
            color: #FFFFFF;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .edit-input-container .edit-row button:hover {
            transform: scale(1.05);
        }
        
        .input-area {
            padding: 10px 16px 14px;
            background: rgba(255, 252, 248, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(212, 160, 140, 0.08);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .input-area .input-row {
            display: flex;
            gap: 8px;
            flex: 1;
            min-width: 0;
            align-items: center;
        }
        .input-area .input-row form {
            display: flex;
            gap: 8px;
            flex: 1;
            align-items: center;
            min-width: 0;
        }
        .input-area input[type="search"] {
            flex: 1;
            padding: 12px 18px;
            background: rgba(245, 230, 211, 0.2);
            border: 1.5px solid rgba(212, 160, 140, 0.08);
            border-radius: 40px;
            color: #3D2C20;
            font-size: 15px;
            outline: none;
            transition: 0.25s;
            font-family: 'Cairo', sans-serif;
            min-width: 60px;
            width: 100%;
            autocomplete: off;
            inputmode: text;
            autocorrect: off;
            autocapitalize: none;
            spellcheck: false;
            data-form-type: other;
            data-lpignore: true;
            data-1p-ignore: true;
        }
        .input-area input[type="search"]:focus {
            border-color: #D4A08C;
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(212, 160, 140, 0.06);
        }
        .input-area input[type="search"]::placeholder {
            color: #C4B0A0;
            font-weight: 300;
        }
        .input-area input[type="search"]::-webkit-search-decoration,
        .input-area input[type="search"]::-webkit-search-cancel-button,
        .input-area input[type="search"]::-webkit-search-results-button,
        .input-area input[type="search"]::-webkit-search-results-decoration {
            display: none;
            -webkit-appearance: none;
        }
        .input-area .action-btn {
            background: none;
            border: none;
            color: #D4A08C;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .input-area .action-btn:hover {
            background: rgba(212, 160, 140, 0.08);
        }
        .input-area .action-btn.recording {
            color: #FF6B6B;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .input-area .send-btn {
            background: linear-gradient(135deg, #D4A08C, #C4907C);
            border: none;
            color: #FFFFFF;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(212, 160, 140, 0.25);
        }
        .input-area .send-btn:active {
            transform: scale(0.95);
        }
        .input-area .file-input {
            display: none;
        }
        
        .empty-chat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #C4B0A0;
            text-align: center;
            padding: 40px;
        }
        .empty-chat i {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
            color: #D4A08C;
        }
        .empty-chat h3 {
            font-weight: 300;
            font-size: 18px;
        }
        .empty-chat p {
            font-size: 13px;
            opacity: 0.5;
            margin-top: 8px;
        }
        
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(61, 44, 32, 0.4);
            backdrop-filter: blur(8px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.25s ease;
        }
        .modal-box {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 32px 24px 28px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(212, 160, 140, 0.10);
            box-shadow: 0 30px 60px rgba(61, 44, 32, 0.12);
        }
        .modal-box h2 {
            font-size: 24px;
            margin-bottom: 20px;

<div class="confirm-dialog" id="confirmDialog">

<div class="modal-overlay" id="chatSettingsModal">

        <h2><i class="fas fa-user-edit"></i> تغيير اسم الشخص</h2>

                <input type="search" 
                       id="customNameInput" 
                       name="search"
                       role="searchbox"
                       placeholder="أدخل الاسم الجديد" 
                       autocomplete="off"
                       inputmode="text"
                       autocorrect="off"
                       autocapitalize="none"
                       spellcheck="false"
                       data-form-type="other"
                       data-lpignore="true"
                       data-1p-ignore="true" />
            </form>
        </div>
        <div id="chatSettingsMessage" class="modal-message"></div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeChatSettings()">إلغاء</button>
            <button class="btn-save" onclick="saveChatSettings()">حفظ</button>

</div>

<script>
    // ====== كل الجافاسكريبت كما هو ======
    // (نفس الكود السابق بالكامل)
    
    const firebaseConfig = {
        apiKey: "AIzaSyBPRXdX-2O76F4-Q553GVY3G0fMsevaQCE",
        authDomain: "bbbb-1135e.firebaseapp.com",
        projectId: "bbbb-1135e",
        storageBucket: "bbbb-1135e.firebasestorage.app",
        messagingSenderId: "337845840358",
        appId: "1:337845840358:web:bcca87af66db9d0c458e27",
        measurementId: "G-2HNLLZD42P"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    
    let currentUser = null;
    let chatUser = null;
    let chatId = null;
    let customName = '';
    let selectedMessageId = null;
    let selectedMessageData = null;
    let unsubscribeMessages = null;
    let allMessages = [];
    let touchTimer = null;
    let touchMessageId = null;
    let replyingTo = null;
    let isSending = false;
    let pendingMessages = {};
    let isFirstLoad = true;
    let messageElements = {};
    let confirmCallback = null;
    let processedMessageIds = new Set();
    let isLoaded = false;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordingTimer = null;
    let recordingSeconds = 0;
    
    function showToast(title, text, icon = '🕊️', duration = 3000) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `
            <div class="toast-icon">${icon}</div>
            <div class="toast-content">
                <div class="toast-title">${title}</div>
                <div class="toast-text">${text}</div>
            </div>
            <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
        `;
        container.appendChild(toast);
        setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 300); }, duration);
    }
    
    function showConfirm(title, message, callback) {
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmMessage').textContent = message;
        document.getElementById('confirmDialog').classList.add('active');
        confirmCallback = callback;
    }
    
    function closeConfirm() {
        document.getElementById('confirmDialog').classList.remove('active');
        confirmCallback = null;
    }
    
    function confirmAction() {
        if (confirmCallback) {
            confirmCallback();
        }
        closeConfirm();
    }
    
    window.onload = function() {
        const saved = localStorage.getItem('chatUser');
        if (!saved) {
            window.location.href = 'login.html';
            return;
        }
        
        try {
            currentUser = JSON.parse(saved);
            
            const chatSession = localStorage.getItem('chatSession');
            if (!chatSession) {
                window.location.href = 'index.html';
                return;
            }
            
            const session = JSON.parse(chatSession);
            chatUser = {
                id: session.userId,
                username: session.username
            };
            
            chatId = [currentUser.id, chatUser.id].sort().join('_');
            
            console.log('🔑 معرف المحادثة:', chatId);
            
            loadCustomName();
            document.getElementById('chatUserName').textContent = chatUser.username;
            updateCustomNameBadge();
            
            loadUserStatus();
            loadMessagesOnce();
            
            setTimeout(() => {
                const input = document.getElementById('messageInput');
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
                scrollToBottom();
            }, 500);
            
        } catch (e) {
            console.error(e);
            window.location.href = 'index.html';
        }
    };
    
    function loadUserStatus() {
        db.collection('users').doc(chatUser.id).onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                const statusEl = document.getElementById('userStatus');
                if (data.online) {
                    statusEl.innerHTML = '<span class="online">🟢 متصل</span>';
                } else {
                    statusEl.innerHTML = '<span class="offline">🔴 غير متصل</span>';
                }
            }
        });
    }
    
    function loadCustomName() {
        try {
            const saved = localStorage.getItem('customName_' + chatUser.id);
            if (saved) {
                customName = saved;
            }
        } catch (e) {}
    }
    
    function updateCustomNameBadge() {
        const badge = document.getElementById('customNameBadge');
        if (customName) {
            badge.textContent = `(${customName})`;
            badge.style.display = 'inline';
        } else {
            badge.style.display = 'none';
        }
    }
    
    function openChatSettings() {
        document.getElementById('chatSettingsModal').classList.add('active');
        document.getElementById('customNameInput').value = customName || '';
        document.getElementById('chatSettingsMessage').className = 'modal-message';
        document.getElementById('chatSettingsMessage').style.display = 'none';
    }
    
    function closeChatSettings() {
        document.getElementById('chatSettingsModal').classList.remove('active');
    }
    
    function saveChatSettings() {
        const newName = document.getElementById('customNameInput').value.trim();
        const msgBox = document.getElementById('chatSettingsMessage');
        
        msgBox.className = 'modal-message';
        msgBox.style.display = 'none';
        
        if (!newName) {
            customName = '';
            localStorage.removeItem('customName_' + chatUser.id);
        } else {
            customName = newName;
            localStorage.setItem('customName_' + chatUser.id, customName);
        }
        
        updateCustomNameBadge();
        msgBox.textContent = '✅ تم تحديث الاسم بنجاح!';
        msgBox.className = 'modal-message success';
        msgBox.style.display = 'block';
        
        setTimeout(() => {
            closeChatSettings();
        }, 1000);
    }
    
    function loadMessagesOnce() {
        if (isLoaded) return;
        
        try {
            const cached = localStorage.getItem('cachedMessages_' + chatId);
            if (cached) {
                const parsed = JSON.parse(cached);
                if (parsed && parsed.length > 0) {
                    allMessages = parsed.map(m => ({
                        ...m,
                        timestamp: m.timestamp ? new Date(m.timestamp) : new Date()
                    }));
                    renderAllMessages(allMessages);
                    setTimeout(() => scrollToBottom(), 100);
                    console.log('📦 تم التحميل من الكاش:', allMessages.length, 'رسالة');
                }
            }
        } catch (e) {}
        
        db.collection('messages')
            .where('chatId', '==', chatId)
            .orderBy('timestamp', 'asc')
            .get()
            .then((snapshot) => {
                const newMessages = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    newMessages.push({
                        id: doc.id,
                        senderId: data.senderId || '',
                        receiverId: data.receiverId || '',
                        text: data.text || '',
                        timestamp: data.timestamp ? data.timestamp.toDate() : new Date(),
                        status: data.status || 'sent',
                        reactions: data.reactions || {},
                        isEdited: data.isEdited || false,
                        isDeleted: data.isDeleted || false,
                        replyTo: data.replyTo || null,
                        file: data.file || null,
                        fileType: data.fileType || null,
                        fileName: data.fileName || null,
                        fileSize: data.fileSize || null,
                        audioUrl: data.audioUrl || null,
                        imageUrl: data.imageUrl || null,
                        videoUrl: data.videoUrl || null
                    });
                });
                
                const tempMessages = Object.values(pendingMessages);
                const combinedMessages = [...newMessages, ...tempMessages];
                combinedMessages.sort((a, b) => a.timestamp.getTime() - b.timestamp.getTime());
                
                if (combinedMessages.length > 0) {
                    allMessages = combinedMessages;
                    try {
                        localStorage.setItem('cachedMessages_' + chatId, JSON.stringify(allMessages));
                    } catch (e) {}
                    
                    renderAllMessages(allMessages);
                    setTimeout(() => scrollToBottom(), 100);
                }
                
                isLoaded = true;
                isFirstLoad = false;
                startRealtimeListener();
            })
            .catch((error) => {
                console.error('❌ خطأ في تحميل الرسائل:', error);
                showToast('⚠️ خطأ', 'فشل تحميل الرسائل', '⚠️', 3000);
            });
    }
    
    function startRealtimeListener() {
        if (unsubscribeMessages) {
            unsubscribeMessages();
            unsubscribeMessages = null;
        }
        
        unsubscribeMessages = db.collection('messages')
            .where('chatId', '==', chatId)
            .orderBy('timestamp', 'asc')
            .onSnapshot((snapshot) => {
                const newMessages = [];
                const tempIds = Object.keys(pendingMessages);
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (tempIds.includes(doc.id)) return;
                    if (processedMessageIds.has(doc.id)) return;
                    
                    newMessages.push({
                        id: doc.id,
                        senderId: data.senderId || '',
                        receiverId: data.receiverId || '',
                        text: data.text || '',
                        timestamp: data.timestamp ? data.timestamp.toDate() : new Date(),
                        status: data.status || 'sent',
                        reactions: data.reactions || {},
                        isEdited: data.isEdited || false,
                        isDeleted: data.isDeleted || false,
                        replyTo: data.replyTo || null,
                        file: data.file || null,
                        fileType: data.fileType || null,
                        fileName: data.fileName || null,
                        fileSize: data.fileSize || null,
                        audioUrl: data.audioUrl || null,
                        imageUrl: data.imageUrl || null,
                        videoUrl: data.videoUrl || null
                    });
                });
                
                if (newMessages.length > 0) {
                    newMessages.forEach(msg => {
                        processedMessageIds.add(msg.id);
                    });
                    
                    allMessages = [...allMessages, ...newMessages];
                    allMessages.sort((a, b) => a.timestamp.getTime() - b.timestamp.getTime());
                    
                    try {
                        localStorage.setItem('cachedMessages_' + chatId, JSON.stringify(allMessages));
                    } catch (e) {}
                    
                    if (!isSending) {
                        addNewMessages(newMessages);
                    }
                    
                    setTimeout(() => scrollToBottom(), 150);
                }
                
                setTimeout(() => {
                    markMessagesAsRead();
                }, 500);
            }, (error) => {
                console.error('❌ خطأ في الاستماع:', error);
            });
    }

    function createMessageHTML(msg) {
        const isSent = msg.senderId === currentUser.id;
        const reactions = msg.reactions || {};
        const reactionKeys = Object.keys(reactions);
        const isEdited = msg.isEdited || false;
        const isRead = msg.status === 'read';
        const isSendingMsg = msg.status === 'sending';
        const isFailed = msg.status === 'failed';
        const isDeleted = msg.isDeleted || false;
        
        let statusText = '';
        if (isSent) {
            if (isSendingMsg) {
                statusText = '<span class="status-label sending">⏳ جاري الإرسال</span>';
            } else if (isFailed) {
                statusText = '<span class="status-label failed">⚠️ فشل الإرسال</span>';
            } else if (isRead) {
                statusText = '<span class="status-label read">✓✓ قرأ</span>';
            } else if (msg.status === 'delivered') {
                statusText = '<span class="status-label">✓✓ وصلت</span>';
            } else {
                statusText = '<span class="status-label">✓ مرسلة</span>';
            }
        } else {
            if (isRead) {
                statusText = '<span class="status-label read">✓✓ مقروءة</span>';
            } else {
                statusText = '<span class="status-label unread">✓ لم يقرأ</span>';
            }
        }
        
        let replyHtml = '';
        if (msg.replyTo) {
            const repliedMsg = allMessages.find(m => m.id === msg.replyTo.id);
            if (repliedMsg && !repliedMsg.isDeleted) {
                const isReplyFromMe = repliedMsg.senderId === currentUser.id;
                replyHtml = `
                    <div class="reply-to">
                        <div class="reply-sender">${isReplyFromMe ? 'أنت' : chatUser.username}</div>
                        <div class="reply-text">${escapeHtml(repliedMsg.text || 'ملف')}</div>
                    </div>
                `;
            }
        }
        
        let reactionsHtml = '';
        if (reactionKeys.length > 0) {
            reactionsHtml = '<div class="message-reactions">';
            reactionKeys.forEach(key => {
                const isActive = reactions[key] === currentUser.id;
                reactionsHtml += `<span class="reaction-emoji ${isActive ? 'active' : ''}" 
                                  onclick="toggleReaction('${msg.id}', '${key}')">${key}</span>`;
            });
            reactionsHtml += '</div>';
        }
        
        const editedLabel = isEdited ? '<span class="edited-label">(تم التعديل)</span>' : '';
        const sendingLabel = isSendingMsg ? '<span class="sending-label">⏳</span>' : '';
        
        let contentHtml = '';
        if (isDeleted) {
            contentHtml = '<span class="deleted-label">🗑️ تم حذف هذه الرسالة</span>';
        } else {
            if (msg.imageUrl) {
                contentHtml += `<img src="${msg.imageUrl}" class="message-media" onclick="window.open('${msg.imageUrl}','_blank')" />`;
            }
            if (msg.videoUrl) {
                contentHtml += `<video src="${msg.videoUrl}" class="message-media" controls onclick="event.stopPropagation()"></video>`;
            }
            if (msg.audioUrl) {
                contentHtml += `<audio src="${msg.audioUrl}" class="message-audio" controls onclick="event.stopPropagation()"></audio>`;
            }
            if (msg.file) {
                const icon = msg.fileType && msg.fileType.startsWith('image/') ? 'fa-image' :
                           msg.fileType && msg.fileType.startsWith('video/') ? 'fa-video' :
                           msg.fileType && msg.fileType.startsWith('audio/') ? 'fa-music' : 'fa-file';
                contentHtml += `<div class="file-name"><i class="fas ${icon}"></i> ${escapeHtml(msg.fileName || 'ملف')}</div>`;
                contentHtml += `<div class="file-size">${formatFileSize(msg.fileSize || 0)}</div>`;
            }
            if (msg.text) {
                contentHtml += escapeHtml(msg.text);
            }
        }
        
        return `
            <div class="message-wrapper ${isSent ? 'sent' : 'received'}" 
                 id="msg-${msg.id}"
                 onclick="handleClick('${msg.id}')"
                 oncontextmenu="event.preventDefault(); openMessageActions('${msg.id}')"
                 ontouchstart="handleTouchStart(event, '${msg.id}')"
                 ontouchend="handleTouchEnd(event)">
                <div class="message-bubble">
                    ${replyHtml}
                    <div class="message-text">
                        ${contentHtml}
                        ${editedLabel}
                        ${sendingLabel}
                    </div>
                    <div class="message-time">
                        ${formatTime(msg.timestamp)}
                        ${statusText}
                    </div>
                    ${!isDeleted ? reactionsHtml : ''}
                </div>
            </div>
        `;
    }
    
    function handleClick(messageId) {

    function addNewMessages(newMessages) {
        const container = document.getElementById('messagesArea');
        
        const emptyState = container.querySelector('.empty-chat');

        newMessages.forEach(msg => {

    async function toggleRecording() {
        if (isRecording) {
            stopRecording();
        } else {
            startRecording();
        }
    }
    
    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                await uploadAudio(audioBlob);
                stream.getTracks().forEach(track => track.stop());
            };
            
            mediaRecorder.start();
            isRecording = true;
            
            document.getElementById('recordBtn').innerHTML = '<i class="fas fa-stop"></i>';
            document.getElementById('recordBtn').classList.add('recording');
            document.getElementById('recordingTimer').classList.add('active');
            
            recordingSeconds = 0;
            updateTimerDisplay();
            recordingTimer = setInterval(() => {
                recordingSeconds++;
                updateTimerDisplay();
            }, 1000);
            
            showToast('🎤 تسجيل', 'جاري التسجيل...', '🎤', 2000);
            
        } catch (error) {
            console.error('❌ خطأ في التسجيل:', error);
            showToast('❌ خطأ', 'فشل الوصول للميكروفون', '❌', 3000);
        }
    }
    
    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            
            document.getElementById('recordBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('recordingTimer').classList.remove('active');
            
            clearInterval(recordingTimer);
        }
    }
    
    function updateTimerDisplay() {
        const minutes = Math.floor(recordingSeconds / 60);
        const seconds = recordingSeconds % 60;
        document.getElementById('recordingTimer').textContent = 
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
    
    async function uploadAudio(audioBlob) {
        const fileName = `audio_${Date.now()}.webm`;
        const storageRef = storage.ref(`chat_audio/${chatId}/${fileName}`);
        
        try {
            const snapshot = await storageRef.put(audioBlob);
            const audioUrl = await snapshot.ref.getDownloadURL();
            await sendMediaMessage(audioUrl, 'audio', fileName, audioBlob.size);
        } catch (error) {
            console.error('❌ خطأ في رفع الصوت:', error);
            showToast('❌ خطأ', 'فشل رفع الملف الصوتي', '❌', 3000);
        }
    }
    
    async function handleFileUpload(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        
        for (const file of files) {
            const fileType = file.type;
            if (fileType.startsWith('image/')) {
                await uploadImage(file);
            } else if (fileType.startsWith('video/')) {
                await uploadVideo(file);
            } else {
                await uploadFile(file);
            }
        }
        event.target.value = '';
    }

    async function sendMediaMessage(url, type, name, size, mimeType = null) {
        const tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        
        const messageData = {
            chatId: chatId,
            senderId: currentUser.id,
            receiverId: chatUser.id,
            text: '',
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            status: 'sending',
            reactions: {},
            isEdited: false,
            isDeleted: false,
            file: url,
            fileType: mimeType || type,
            fileName: name,
            fileSize: size
        };
        
        if (type === 'image') messageData.imageUrl = url;
        if (type === 'video') messageData.videoUrl = url;
        if (type === 'audio') messageData.audioUrl = url;
        
        const localMessage = {
            id: tempId,
            senderId: currentUser.id,
            receiverId: chatUser.id,
            text: '',
            timestamp: new Date(),
            status: 'sending',
            reactions: {},
            isEdited: false,
            isDeleted: false,
            file: url,
            fileType: mimeType || type,
            fileName: name,
            fileSize: size,
            imageUrl: type === 'image' ? url : null,
            videoUrl: type === 'video' ? url : null,
            audioUrl: type === 'audio' ? url : null
        };
        
        pendingMessages[tempId] = localMessage;
        allMessages.push(localMessage);
        
        const container = document.getElementById('messagesArea');
        const emptyState = container.querySelector('.empty-chat');
        if (emptyState) emptyState.remove();
        
        const html = createMessageHTML(localMessage);
        container.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
        
        try {
            const docRef = await db.collection('messages').add(messageData);
            const realId = docRef.id;
            
            delete pendingMessages[tempId];
            
            const index = allMessages.findIndex(m => m.id === tempId);
            if (index !== -1) {
                allMessages[index].id = realId;
                allMessages[index].status = 'sent';
            }
            
            processedMessageIds.add(realId);
            
            const oldEl = document.getElementById('msg-' + tempId);
            if (oldEl) {
                oldEl.id = 'msg-' + realId;
                const newHtml = createMessageHTML(allMessages[index]);
                oldEl.outerHTML = newHtml;
            }
            
            showToast('✅ تم الإرسال', 'تم إرسال الملف بنجاح', '✅', 2000);
            
        } catch (error) {
            console.error('❌ خطأ:', error);
            showToast('❌ خطأ', 'فشل إرسال الملف', '❌', 3000);
            
            const index = allMessages.findIndex(m => m.id === tempId);
            if (index !== -1) {
                allMessages[index].status = 'failed';
                const el = document.getElementById('msg-' + tempId);
                if (el) {
                    const newHtml = createMessageHTML(allMessages[index]);
                    el.outerHTML = newHtml;
                }
            }
        }
    }
    
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        
        if (!text || isSending) return;
        
        isSending = true;
        
        const tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        
        const localMessage = {
            id: tempId,
            senderId: currentUser.id,
            receiverId: chatUser.id,
            text: text,
            timestamp: new Date(),
            status: 'sending',
            reactions: {},
            isEdited: false,
            isDeleted: false,
            replyTo: replyingTo ? {
                id: replyingTo.id,
                text: replyingTo.text,
                sender: replyingTo.sender
            } : null,
            file: null,
            fileType: null,
            fileName: null,
            fileSize: null,
            imageUrl: null,
            videoUrl: null,
            audioUrl: null
        };
        
        pendingMessages[tempId] = localMessage;
        allMessages.push(localMessage);
        
        const container = document.getElementById('messagesArea');
        const emptyState = container.querySelector('.empty-chat');
        if (emptyState) emptyState.remove();
        
        const html = createMessageHTML(localMessage);
        container.insertAdjacentHTML('beforeend', html);
        scrollToBottom();
        
        input.value = '';
        input.focus();
        
        const replyData = replyingTo;
        if (replyingTo) cancelReply();
        
        try {
            const messageData = {
                chatId: chatId,
                senderId: currentUser.id,
                receiverId: chatUser.id,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                status: 'sent',
                reactions: {},
                isEdited: false,
                isDeleted: false,
                file: null,
                fileType: null,
                fileName: null,
                fileSize: null,
                imageUrl: null,
                videoUrl: null,
                audioUrl: null
            };
            
            if (replyData) {
                messageData.replyTo = {
                    id: replyData.id,
                    text: replyData.text,
                    sender: replyData.sender
                };
            }
            
            const docRef = await db.collection('messages').add(messageData);
            const realId = docRef.id;
            
            delete pendingMessages[tempId];
            
            const index = allMessages.findIndex(m => m.id === tempId);
            if (index !== -1) {
                allMessages[index].id = realId;
                allMessages[index].status = 'sent';
            }
            
            processedMessageIds.add(realId);
            
            const oldEl = document.getElementById('msg-' + tempId);
            if (oldEl) {
                oldEl.id = 'msg-' + realId;
                const newHtml = createMessageHTML(allMessages[index]);
                oldEl.outerHTML = newHtml;
            }
            
        } catch (error) {
            console.error('❌ خطأ:', error);
            
            const index = allMessages.findIndex(m => m.id === tempId);
            if (index !== -1) {
                allMessages[index].status = 'failed';
                const el = document.getElementById('msg-' + tempId);
                if (el) {
                    const newHtml = createMessageHTML(allMessages[index]);
                    el.outerHTML = newHtml;
                }
            }
            
            showToast('❌ فشل الإرسال', 'حدث خطأ في الإرسال', '❌', 3000);
            input.focus();
        } finally {
            isSending = false;
        }
    }
    
    function copyMessage() {
        if (!selectedMessageData) return;
        const text = selectedMessageData.text || '';

            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 تم النسخ', 'تم نسخ الرسالة إلى الحافظة', '📋', 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
                showToast('📋 تم النسخ', 'تم نسخ الرسالة إلى الحافظة', '📋', 2000);
            });
        } else {
            showToast('⚠️ تنبيه', 'لا يوجد نص لنسخه', '⚠️', 2000);
        }
        closeMessageActions();
    }

    function handleTouchStart(event, messageId) {
        touchTimer = setTimeout(() => {
            const msg = allMessages.find(m => m.id === messageId);
            if (!msg || msg.id.startsWith('temp_') || msg.isDeleted) return;
            openMessageActions(messageId);
        }, 500);
        touchMessageId = messageId;
    }
    
    function handleTouchEnd(event) {
        if (touchTimer) {
            clearTimeout(touchTimer);
            touchTimer = null;
        }
    }
    
    function showReactionPopup(messageId) {
        selectedMessageId = messageId;
        const popup = document.getElementById('reactionPopup');
        popup.classList.add('active');
        clearTimeout(window.reactionTimeout);
        window.reactionTimeout = setTimeout(() => {
            closeReactionPopup();
        }, 5000);
    }
    
    function closeReactionPopup() {
        document.getElementById('reactionPopup').classList.remove('active');
        selectedMessageId = null;
    }
    
    async function addReaction(emoji) {
        if (!selectedMessageId) return;
        try {
            const msgRef = db.collection('messages').doc(selectedMessageId);
            const doc = await msgRef.get();
            const data = doc.data();
            const reactions = data.reactions || {};
            
            if (reactions[emoji] === currentUser.id) {
                delete reactions[emoji];
            } else {
                for (const key in reactions) {
                    if (reactions[key] === currentUser.id) {
                        delete reactions[key];
                    }
                }
                reactions[emoji] = currentUser.id;
            }
            
            await msgRef.update({ reactions: reactions });
            closeReactionPopup();
        } catch (error) {
            console.error('❌ خطأ:', error);
            showToast('❌ خطأ', 'فشل إضافة التفاعل', '❌', 2000);
        }
    }
    
    async function toggleReaction(messageId, emoji) {
        selectedMessageId = messageId;
        await addReaction(emoji);
    }
    
    function goBack() {
        window.location.href = 'index.html';
    }
    
    function formatTime(date) {
        if (!date) return '';
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const msgDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        if (msgDate.getTime() === today.getTime()) {
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        } else {
            return date.toLocaleDateString('ar-EG', { day: '2-digit', month: 'short' });
        }
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
        return (bytes / 1073741824).toFixed(1) + ' GB';
    }
    
    window.addEventListener('beforeunload', function() {
        if (unsubscribeMessages) {
            unsubscribeMessages();
        }
        if (isRecording) {
            stopRecording();
        }
    });
    
    console.log('📱 رسائلنا — الدردشة النهائية ✅');
    console.log('🔒 تم منع أيقونات (المفتاح - الموقع - بطاقة الدفع)');
    console.log('📌 الاسم والصورة ثابتين مع الكيبورد زي واتساب');
    console.log('⚡️ إرسال فوري بدون إعادة رسم');
</script>
